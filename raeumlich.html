<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DLR Räumliches Vorstellungsvermögen</title>
<!-- procedural-generator-v1 -->

<style>
:root{
  --blue:#bfe3f2;
  --blue2:#8fc7dc;
  --ink:#0b6f8e;
  --rod:#0b7898;
  --node:#0d86aa;
  --good:#4f9b2c;
  --bad:#b42318;
  --line:#d7d7d7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#fff;color:#111;
  font-family:Arial,Helvetica,sans-serif
}
body{min-height:100dvh}

.timer-track{
  position:fixed;top:0;left:0;width:100%;height:6px;
  background:#e7e7e7;z-index:1000
}
.timer-fill{
  height:100%;width:0;background:#8fc7dc;will-change:width
}

.site-nav{
  height:40px;
  padding:8px 8px 0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px
}
.site-nav a{
  display:flex;align-items:center;justify-content:center;
  border:1px solid #aaa;border-radius:5px;
  background:#fff;color:#111;text-decoration:none;
  font-size:10px;font-weight:700
}
.site-nav a.active{background:var(--blue);border-color:var(--blue2)}

.app{
  width:min(980px,100%);
  height:calc(100dvh - 40px);
  margin:0 auto;
  padding:6px 10px 10px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  gap:5px
}

.header{
  min-height:24px;
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.title{font-size:15px;font-weight:700}
.stats{
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
  font-size:9px;font-variant-numeric:tabular-nums
}
.stats b{font-size:10px}

.stage{
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  gap:8px;
  align-items:center
}
.separator{
  width:1px;height:74%;background:#cdd8dc;justify-self:center
}
.panel{
  min-width:0;min-height:0;
  height:100%;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  align-items:center
}
.panel-title{
  font-size:15px;
  padding:2px 0 4px;
  text-align:center
}

.start-wrap{
  position:relative;
  width:100%;
  height:100%;
  min-height:300px
}
.target-wrap{
  width:100%;
  height:100%;
  min-height:300px
}

.view-svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible
}

.arrow{
  position:absolute;
  width:46px;height:46px;
  border:0;background:transparent;
  color:#111;font-size:38px;font-weight:900;
  line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer
}
.arrow.selected{
  color:#4f9fb9;
  text-shadow:0 0 0 #4f9fb9
}
.arrow.up{left:50%;top:2%;transform:translateX(-50%)}
.arrow.down{left:50%;bottom:2%;transform:translateX(-50%)}
.arrow.left{left:3%;top:50%;transform:translateY(-50%)}
.arrow.right{right:3%;top:50%;transform:translateY(-50%)}

.result{
  min-height:26px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:13px;font-weight:700
}
.result.good{color:var(--good)}
.result.bad{color:var(--bad)}

.next{
  width:min(330px,100%);
  margin:0 auto 8px;
  height:36px;
  border:1px solid #777;border-radius:5px;background:#efefef;
  color:#111;font-size:13px;font-weight:700
}
.next.pressed{background:var(--blue)}

@media(max-width:620px){
  .site-nav{height:38px}
  .app{height:calc(100dvh - 38px);padding:4px 6px 7px}
  .title{font-size:12px}
  .stats{font-size:8px;gap:5px}
  .stage{gap:4px}
  .panel-title{font-size:12px}
  .start-wrap,.target-wrap{min-height:240px}
  .arrow{width:38px;height:38px;font-size:31px}
  .next{height:34px}
}

@media(max-height:700px){
  .start-wrap,.target-wrap{min-height:205px}
  .panel-title{font-size:11px}
  .arrow{width:34px;height:34px;font-size:28px}
}
</style>
</head>

<body>

<div class="timer-track"><div id="timerFill" class="timer-fill"></div></div>

<nav class="site-nav" aria-label="DLR Training Navigation">
  <a href="index.html">Zahlen</a>
  <a href="rechnen.html">Rechnen</a>
  <a href="konzentration.html">Konzentration</a>
  <a href="raeumlich.html" class="active">Räumlich</a>
</nav>

<main class="app">
  <div class="header">
    <div class="title">DLR Räumliches Vorstellungsvermögen</div>
    <div class="stats">
      <span>R <b id="correct">0</b></span>
      <span>F <b id="wrong">0</b></span>
      <span>Quote <b id="rate">0%</b></span>
      <span>Serie <b id="best">0</b></span>
    </div>
  </div>

  <section class="stage">
    <div class="panel">
      <div class="panel-title">Start view</div>
      <div class="start-wrap">
        <svg id="startSvg" class="view-svg" viewBox="0 0 420 340" aria-label="Startansicht"></svg>

        <button class="arrow up" data-dir="up" type="button">↓</button>
        <button class="arrow down" data-dir="down" type="button">↑</button>
        <button class="arrow left" data-dir="left" type="button">→</button>
        <button class="arrow right" data-dir="right" type="button">←</button>
      </div>
    </div>

    <div class="separator"></div>

    <div class="panel">
      <div class="panel-title">Target view</div>
      <div class="target-wrap">
        <svg id="targetSvg" class="view-svg" viewBox="0 0 420 340" aria-label="Zielansicht"></svg>
      </div>
    </div>
  </section>

  <div id="result" class="result"></div>
  <button id="next" class="next" type="button">Next</button>
</main>

  const directions = ["up","right","down","left"];
  const azimuths = {
    up: 225,
    right: 315,
    down: 45,
    left: 135
  };

  function deg(d){ return d*Math.PI/180; }

  function rotateXYZ(p,yawDeg,pitchDeg,rollDeg=0){
    let x=p.x, y=p.y, z=p.z;

    // yaw around vertical world axis
    let a=deg(yawDeg), c=Math.cos(a), s=Math.sin(a);
    let x1=x*c-y*s;
    let y1=x*s+y*c;
    let z1=z;

    // pitch around camera-horizontal axis
    a=deg(pitchDeg); c=Math.cos(a); s=Math.sin(a);
    let x2=x1;
    let y2=y1*c-z1*s;
    let z2=y1*s+z1*c;

    // slight roll for variation
    a=deg(rollDeg); c=Math.cos(a); s=Math.sin(a);
    let x3=x2*c-y2*s;
    let y3=x2*s+y2*c;
    let z3=z2;

    return {x:x3,y:y3,z:z3};
  }

  function modelRadius(m){
    let r=.1;
    m.points.forEach(p=>{
      r=Math.max(r,Math.hypot(p.x,p.y,p.z));
    });
    return r;
  }

  function projectedGeometry(m,camera){
    const radius=modelRadius(m);
    const cameraDistance=radius*4.4+2.0;
    const baseScale=94/Math.max(1,radius);

    const pts=m.points.map((p,i)=>{
      const r=rotateXYZ(p,camera.yaw,camera.pitch,camera.roll||0);
      const denom=Math.max(.85,cameraDistance-r.z);
      const perspective=cameraDistance/denom;

      return {
        i,
        x:r.x,
        y:r.y,
        z:r.z,
        perspective,
        sx:210+r.x*baseScale*perspective,
        sy:170-r.y*baseScale*perspective
      };
    });

    const edges=m.edges.map(edge=>{
      if(Array.isArray(edge)){
        const [a,b]=edge;
        const pa=pts[a],pb=pts[b];
        return {
          type:"line",a,b,
          depth:(pa.z+pb.z)/2,
          perspective:(pa.perspective+pb.perspective)/2
        };
      }

      if(edge.type==="curve"){
        const pa=pts[edge.a],pb=pts[edge.b];
        return {
          type:"curve",
          a:edge.a,b:edge.b,
          bend:edge.bend ?? .35,
          side:edge.side ?? 1,
          depth:(pa.z+pb.z)/2,
          perspective:(pa.perspective+pb.perspective)/2
        };
      }

      if(edge.type==="ring"){
        const pc=pts[edge.center];
        return {
          type:"ring",
          center:edge.center,
          radius:edge.radius ?? .55,
          tilt:edge.tilt ?? 0,
          depth:pc.z,
          perspective:pc.perspective
        };
      }

      return null;
    }).filter(Boolean).sort((a,b)=>a.depth-b.depth);

    return {pts,edges,radius};
  }

  function viewDifference(m,c1,c2){
    const g1=projectedGeometry(m,c1);
    const g2=projectedGeometry(m,c2);

    const mean=arr=>({
      x:arr.reduce((s,p)=>s+p.sx,0)/arr.length,
      y:arr.reduce((s,p)=>s+p.sy,0)/arr.length
    });

    const m1=mean(g1.pts);
    const m2=mean(g2.pts);

    let sum=0;
    for(let i=0;i<g1.pts.length;i++){
      const dx=(g1.pts[i].sx-m1.x)-(g2.pts[i].sx-m2.x);
      const dy=(g1.pts[i].sy-m1.y)-(g2.pts[i].sy-m2.y);
      sum+=dx*dx+dy*dy;
    }
    return Math.sqrt(sum/g1.pts.length);
  }

  function renderModel(svg,m,camera){

    const ns="http://www.w3.org/2000/svg";

    const nodeGrad=document.createElementNS(ns,"radialGradient");
    nodeGrad.setAttribute("id","nodeGrad");
    nodeGrad.setAttribute("cx","30%");
    nodeGrad.setAttribute("cy","25%");
    nodeGrad.setAttribute("r","74%");
    [
      ["0%","#d7f5fb"],
      ["16%","#84d5e8"],

    ].forEach(([offset,color])=>{

      s.setAttribute("stop-color",color);

    });

    const rodGrad=document.createElementNS(ns,"linearGradient");
    rodGrad.setAttribute("id","rodGrad");
    rodGrad.setAttribute("x1","0%");
    rodGrad.setAttribute("y1","0%");
    rodGrad.setAttribute("x2","0%");
    rodGrad.setAttribute("y2","100%");
    [
      ["0%","#8fd8e8"],
      ["28%","#2b9ab8"],
      ["68%","#0c6d8c"],
      ["100%","#054b64"]
    ].forEach(([offset,color])=>{
      const s=document.createElementNS(ns,"stop");
      s.setAttribute("offset",offset);
      s.setAttribute("stop-color",color);

    const shadow=document.createElementNS(ns,"filter");

    shadow.setAttribute("x","-35%");
    shadow.setAttribute("y","-35%");

    shadow.innerHTML=`
      <feDropShadow dx="1.8" dy="2.4" stdDeviation="1.8"
                    flood-color="#000" flood-opacity=".24"/>
    `;

    defs.appendChild(nodeGrad);
    defs.appendChild(rodGrad);
    defs.appendChild(shadow);
    svg.appendChild(defs);

    function widthFor(persp,base){
      return base*Math.max(.72,Math.min(1.38,persp||1));
    }

    function addPath(d,perspective=1){
      const outer=document.createElementNS(ns,"path");
      outer.setAttribute("d",d);
      outer.setAttribute("fill","none");
      outer.setAttribute("stroke","#05485f");
      outer.setAttribute("stroke-width",widthFor(perspective,9.2));
      outer.setAttribute("stroke-linecap","round");
      outer.setAttribute("stroke-linejoin","round");
      outer.setAttribute("filter","url(#softShadow)");
      svg.appendChild(outer);

      const inner=document.createElementNS(ns,"path");
      inner.setAttribute("d",d);
      inner.setAttribute("fill","none");
      inner.setAttribute("stroke","url(#rodGrad)");
      inner.setAttribute("stroke-width",widthFor(perspective,5.8));
      inner.setAttribute("stroke-linecap","round");
      inner.setAttribute("stroke-linejoin","round");
      svg.appendChild(inner);

      const shine=document.createElementNS(ns,"path");
      shine.setAttribute("d",d);
      shine.setAttribute("fill","none");
      shine.setAttribute("stroke","#c4eef6");
      shine.setAttribute("stroke-opacity",".30");
      shine.setAttribute("stroke-width",widthFor(perspective,1.1));
      shine.setAttribute("stroke-linecap","round");
      svg.appendChild(shine);
    }

    // Back-to-front rendering gives actual visual depth.
    g.edges.forEach(e=>{
      if(e.type==="line"){
        const a=g.pts[e.a],b=g.pts[e.b];
        addPath(`M ${a.sx} ${a.sy} L ${b.sx} ${b.sy}`,e.perspective);
        return;
      }

      if(e.type==="curve"){
        const a=g.pts[e.a],b=g.pts[e.b];
        const dx=b.sx-a.sx,dy=b.sy-a.sy;
        const len=Math.max(1,Math.hypot(dx,dy));
        const nx=-dy/len,ny=dx/len;
        const amp=len*e.bend*e.side;
        const cx=(a.sx+b.sx)/2+nx*amp;
        const cy=(a.sy+b.sy)/2+ny*amp;
        addPath(`M ${a.sx} ${a.sy} Q ${cx} ${cy} ${b.sx} ${b.sy}`,e.perspective);
        return;
      }

      if(e.type==="ring"){
        const c=g.pts[e.center];
        const rx=e.radius*56*(e.perspective||1);
        const ry=rx*(.38+.42*Math.abs(Math.cos(deg(e.tilt))));

        const outer=document.createElementNS(ns,"ellipse");
        outer.setAttribute("cx",c.sx);
        outer.setAttribute("cy",c.sy);
        outer.setAttribute("rx",rx);
        outer.setAttribute("ry",ry);
        outer.setAttribute("fill","none");
        outer.setAttribute("stroke","#05485f");
        outer.setAttribute("stroke-width",widthFor(e.perspective,9.2));
        outer.setAttribute("filter","url(#softShadow)");
        svg.appendChild(outer);

        const inner=document.createElementNS(ns,"ellipse");
        inner.setAttribute("cx",c.sx);
        inner.setAttribute("cy",c.sy);
        inner.setAttribute("rx",rx);
        inner.setAttribute("ry",ry);
        inner.setAttribute("fill","none");
        inner.setAttribute("stroke","url(#rodGrad)");
        inner.setAttribute("stroke-width",widthFor(e.perspective,5.8));
        svg.appendChild(inner);
      }
    });

    [...g.pts].sort((a,b)=>a.z-b.z).forEach(p=>{
      const r=widthFor(p.perspective,11.1);

      const c=document.createElementNS(ns,"circle");
      c.setAttribute("cx",p.sx);
      c.setAttribute("cy",p.sy);
      c.setAttribute("r",r);
      c.setAttribute("fill","url(#nodeGrad)");
      c.setAttribute("stroke","#05485f");
      c.setAttribute("stroke-width",widthFor(p.perspective,1.8));
      c.setAttribute("filter","url(#softShadow)");
      svg.appendChild(c);

      const hi=document.createElementNS(ns,"circle");
      hi.setAttribute("cx",p.sx-r*.28);
      hi.setAttribute("cy",p.sy-r*.32);
      hi.setAttribute("r",r*.22);
      hi.setAttribute("fill","#e5f9fd");
      hi.setAttribute("fill-opacity",".76");
      svg.appendChild(hi);
    });
  }


  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

  function addEdgeUnique(edges,edge,keySet){
    let key;
    if(Array.isArray(edge)){
      const a=Math.min(edge[0],edge[1]), b=Math.max(edge[0],edge[1]);
      key="L:"+a+":"+b;
    }else if(edge.type==="curve"){
      const a=Math.min(edge.a,edge.b), b=Math.max(edge.a,edge.b);
      key="C:"+a+":"+b+":"+Math.round((edge.bend||.3)*100)+":"+(edge.side||1);
    }else if(edge.type==="ring"){
      key="R:"+edge.center+":"+Math.round((edge.radius||.5)*100)+":"+Math.round(edge.tilt||0);
    }else{
      return;
    }
    if(!keySet.has(key)){
      keySet.add(key);
      edges.push(edge);
    }
  }

  function nearestIndices(points,index,count=3){
    const p=points[index];
    return points
      .map((q,i)=>({i,d:i===index?Infinity:Math.hypot(p.x-q.x,p.y-q.y,p.z-q.z)}))
      .sort((a,b)=>a.d-b.d)
      .slice(0,count)
      .map(o=>o.i);
  }

  function generateSpatialModel(){
    const complexity = pick(["easy","medium","medium","hard"]);
    const nodeCount =
      complexity==="easy" ? rand(7,10) :
      complexity==="medium" ? rand(10,15) :
      rand(15,22);

    const points=[];
    const edges=[];
    const keys=new Set();

    // Build a 3D "spine" first. It deliberately changes direction and height.
    let x=-1.5, y=(Math.random()-.5)*.8, z=(Math.random()-.5)*.25;
    points.push(v(x,y,z));

    for(let i=1;i<nodeCount;i++){
      const phase=i/(nodeCount-1);
      const dx=0.28+Math.random()*.42;
      x += dx;

      y += (Math.random()-.5)*(complexity==="hard"?.95:.72);
      z += (Math.random()-.5)*(complexity==="hard"?.9:.68);

      // occasional strong depth jumps; prevents flat-looking models
      if(Math.random()<.28){
        z += (Math.random()<.5?-1:1)*(0.5+Math.random()*.75);
      }

      // occasional return/curl in x for open loops / tangled forms
      if(Math.random()<.16){
        x -= 0.45+Math.random()*.75;
      }

      points.push(v(
        clamp(x,-2.0,2.0),
        clamp(y,-1.65,1.65),
        clamp(z,-1.55,1.8)
      ));
    }

    // Normalize center
    const mx=points.reduce((s,p)=>s+p.x,0)/points.length;
    const my=points.reduce((s,p)=>s+p.y,0)/points.length;
    const mz=points.reduce((s,p)=>s+p.z,0)/points.length;
    points.forEach(p=>{p.x-=mx;p.y-=my;p.z-=mz;});

    // Main chain: mix straight and curved pieces.
    for(let i=0;i<points.length-1;i++){
      if(Math.random() < (complexity==="easy"?.18:.30)){
        addEdgeUnique(edges,{
          type:"curve",a:i,b:i+1,
          bend:.18+Math.random()*.34,
          side:Math.random()<.5?-1:1
        },keys);
      }else{
        addEdgeUnique(edges,[i,i+1],keys);
      }
    }

    // Add cross-connections to create cages / triangles / prisms / crossings.
    const extra =
      complexity==="easy" ? rand(3,5) :
      complexity==="medium" ? rand(6,10) :
      rand(10,17);

    for(let k=0;k<extra;k++){
      const a=rand(0,points.length-1);
      const candidates=nearestIndices(points,a,Math.min(6,points.length-1));
      if(!candidates.length) continue;

      let b=pick(candidates);
      if(Math.abs(a-b)<=1 && Math.random()<.65){
        b=rand(0,points.length-1);
      }
      if(a===b) continue;

      const pa=points[a],pb=points[b];
      const dist=Math.hypot(pa.x-pb.x,pa.y-pb.y,pa.z-pb.z);
      if(dist>2.7) continue;

      if(Math.random()<.27){
        addEdgeUnique(edges,{
          type:"curve",a,b,
          bend:.16+Math.random()*.38,
          side:Math.random()<.5?-1:1
        },keys);
      }else{
        addEdgeUnique(edges,[a,b],keys);
      }
    }

    // Add local triangular / cage motifs.
    const motifs =
      complexity==="easy" ? rand(0,1) :
      complexity==="medium" ? rand(1,3) :
      rand(2,5);

    for(let m=0;m<motifs;m++){
      const a=rand(0,points.length-3);
      const b=Math.min(points.length-1,a+rand(1,2));
      const c=Math.min(points.length-1,b+rand(1,2));
      if(a!==b && b!==c && a!==c){
        addEdgeUnique(edges,[a,b],keys);
        addEdgeUnique(edges,[b,c],keys);
        if(Math.random()<.78) addEdgeUnique(edges,[a,c],keys);
      }
    }

    // Genuine ring elements, but not in every task.
    const ringChance =
      complexity==="easy" ? .12 :
      complexity==="medium" ? .22 : .32;

    const ringCount = Math.random()<ringChance ? rand(1, complexity==="hard"?3:2) : 0;
    for(let r=0;r<ringCount;r++){
      const center=rand(0,points.length-1);
      addEdgeUnique(edges,{
        type:"ring",
        center,
        radius:.38+Math.random()*.42,
        tilt:rand(0,85)
      },keys);
    }

    // Open C/U/S style curves: create long curved shortcuts without closing everything.
    const openCurves =
      complexity==="easy" ? rand(0,1) :
      complexity==="medium" ? rand(1,3) :
      rand(2,5);

    for(let c=0;c<openCurves;c++){
      const a=rand(0,points.length-3);
      const b=rand(a+2,points.length-1);
      addEdgeUnique(edges,{
        type:"curve",a,b,
        bend:.28+Math.random()*.40,
        side:Math.random()<.5?-1:1
      },keys);
    }

    // Reject obviously weak / too sparse topologies by ensuring adequate degree.
    const degree=Array(points.length).fill(0);
    edges.forEach(e=>{
      if(Array.isArray(e)){
        degree[e[0]]++; degree[e[1]]++;
      }else if(e.type==="curve"){
        degree[e.a]++; degree[e.b]++;
      }else if(e.type==="ring"){
        degree[e.center]+=2;
      }
    });

    // Add connections to isolated/weak nodes.
    for(let i=0;i<degree.length;i++){
      if(degree[i]>=2) continue;
      const near=nearestIndices(points,i,4).filter(j=>degree[j]>0);
      if(!near.length) continue;
      const j=pick(near);
      addEdgeUnique(edges,[i,j],keys);
      degree[i]++; degree[j]++;
    }

    return {
      name:"generated-"+complexity+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
      points,
      edges,
      generated:true,
      complexity
    };
  }

  function modelQuality(m){
    // Measures genuine 3D spread. High score means not flat.
    const xs=m.points.map(p=>p.x), ys=m.points.map(p=>p.y), zs=m.points.map(p=>p.z);
    const span=a=>Math.max(...a)-Math.min(...a);
    const sx=span(xs), sy=span(ys), sz=span(zs);

    const dimensions=[sx,sy,sz].sort((a,b)=>a-b);
    const dimensionality=dimensions[0]/Math.max(.01,dimensions[2]);

    const edgeCount=m.edges.length;
    const nodeCount=m.points.length;
    const density=edgeCount/Math.max(1,nodeCount);

    return dimensionality*90 + density*16 + nodeCount*.7;
  }

  function generateGoodSpatialModel(){
    for(let i=0;i<80;i++){
      const m=generateSpatialModel();
      if(modelQuality(m) < 40) continue;
      return m;
    }

    // Reserve only if generator somehow fails.
    return transformedModel(pick(MODELS));
  }

  function transformedModel(base){
    const mirrorX=Math.random()<.5?-1:1;
    const mirrorY=Math.random()<.5?-1:1;
    const stretchZ=.95+Math.random()*.48;

    return {
      name:base.name,
      points:base.points.map(p=>({
        x:p.x*mirrorX,
        y:p.y*mirrorY,
        z:p.z*stretchZ
      })),
      edges:base.edges
    };
  }

  function targetCameraFor(start,dir){
    if(dir==="left"){
      return {yaw:start.yaw-90,pitch:start.pitch,roll:start.roll};
    }
    if(dir==="right"){
      return {yaw:start.yaw+90,pitch:start.pitch,roll:start.roll};
    }
    if(dir==="up"){
      return {yaw:start.yaw,pitch:start.pitch+72,roll:start.roll};
    }
    return {yaw:start.yaw,pitch:start.pitch-72,roll:start.roll};
  }

  function chooseTask(){
    for(let attempt=0;attempt<220;attempt++){
      // New task = newly generated topology, not merely a rotated preset.
      const candidate=generateGoodSpatialModel();

      const startCamera={
        yaw:rand(12,78),
        pitch:rand(14,36),
        roll:pick([-5,-3,0,0,0,3,5])
      };

      const dir=pick(directions);
      const targetCamera=targetCameraFor(startCamera,dir);

      // Reject views that are too similar.
      const diff=viewDifference(candidate,startCamera,targetCamera);
      if(diff<68) continue;

      // Reject if two alternative directions are visually almost as plausible.
      const targetGeom=projectedGeometry(candidate,targetCamera);
      const alternatives=directions
        .filter(d=>d!==dir)
        .map(d=>({
          d,
          diff:viewDifference(candidate,targetCameraFor(startCamera,d),targetCamera)
        }))
        .sort((a,b)=>a.diff-b.diff);

      // The mathematically correct view should be distinctly different from alternatives.
      if(alternatives.length && alternatives[0].diff<26) continue;

      model=candidate;
      answerDir=dir;

      renderModel(startSvg,model,startCamera);
      renderModel(targetSvg,model,targetCamera);
      return;
    }

    // Last-resort reserve.
    model=transformedModel(
      MODELS.find(m=>m.name==="asymmetric-cage") || MODELS[0]
    );
    const startCamera={yaw:37,pitch:25,roll:0};
    answerDir="right";
    renderModel(startSvg,model,startCamera);
    renderModel(targetSvg,model,targetCameraFor(startCamera,answerDir));
  }

  function setSelected(dir){
    if(evaluated) return;
    selectedDir=dir;
    arrowButtons.forEach(b=>{
      b.classList.toggle("selected",b.dataset.dir===dir);
    });
  }

  function evaluate(fromTimeout=false){
    if(evaluated) return;

    cancelAnimationFrame(raf);
    evaluated=true;
    timerFill.style.width="100%";

    const ok = selectedDir===answerDir;

    if(ok){
      stats.correct++;
      stats.streak++;
      stats.best=Math.max(stats.best,stats.streak);
      result.textContent="Richtig";
      result.className="result good";
    }else{
      stats.wrong++;
      stats.streak=0;
      const names={up:"oben",right:"rechts",down:"unten",left:"links"};
      result.textContent = selectedDir
        ? "Falsch · richtig wäre: " + names[answerDir]
        : "Zeit abgelaufen · richtig wäre: " + names[answerDir];
      result.className="result bad";
    }

    saveStats();
    next.textContent="Nächste Aufgabe";
  }

  function animate(){
    if(evaluated) return;

    const elapsed=performance.now()-startedAt;
    const pct=Math.min(elapsed/ROUND_MS,1);
    timerFill.style.width=(pct*100)+"%";

    if(pct>=1){
      evaluate(true);
      return;
    }

    raf=requestAnimationFrame(animate);
  }

  function startNew(){
    cancelAnimationFrame(raf);
    evaluated=false;
    selectedDir=null;
    result.textContent="";
    result.className="result";
    next.textContent="Next";
    timerFill.style.width="0%";
    arrowButtons.forEach(b=>b.classList.remove("selected"));

    chooseTask();

    startedAt=performance.now();
    raf=requestAnimationFrame(animate);
  }

  arrowButtons.forEach(btn=>{
    btn.addEventListener("pointerdown",ev=>{
      ev.preventDefault();
      setSelected(btn.dataset.dir);
    },{passive:false});
  });

  next.addEventListener("pointerdown",ev=>{
    ev.preventDefault();
    next.classList.add("pressed");
    setTimeout(()=>next.classList.remove("pressed"),80);

    if(evaluated){
      startNew();
    }else{
      evaluate(false);
    }
  },{passive:false});

  document.addEventListener("dblclick",ev=>ev.preventDefault(),{passive:false});

  saveStats();
  startNew();
})();
</script>
</body>
</html>
