<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DLR Räumliches Vorstellungsvermögen V2</title>

<style>
:root{
  --blue:#bfe3f2;
  --blue2:#8fc7dc;
  --cyan:#0b7898;
  --cyan-dark:#07546c;
  --good:#4f9b2c;
  --bad:#b42318;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body,button{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}
body{min-height:100dvh}

.timer-track{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:6px;
  background:#e7e7e7;
  z-index:1000;
}
.timer-fill{
  width:0;
  height:100%;
  background:#8fc7dc;
  will-change:width;
}

.site-nav{
  height:42px;
  padding:9px 8px 0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}
.site-nav a{
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #aaa;
  border-radius:5px;
  color:#111;
  background:#fff;
  text-decoration:none;
  font-size:11px;
  font-weight:700;
}
.site-nav a.active{
  background:var(--blue);
  border-color:var(--blue2);
}

.app{
  width:min(1050px,100%);
  height:calc(100dvh - 42px);
  margin:0 auto;
  padding:7px 12px 10px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  gap:4px;
}
.header{
  min-height:26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.title{
  font-size:16px;
  font-weight:700;
}
.stats{
  display:flex;
  gap:9px;
  font-size:10px;
  white-space:nowrap;
}
.stats b{font-size:11px}

.stage{
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  align-items:stretch;
  gap:10px;
}
.separator{
  width:1px;
  height:76%;
  align-self:center;
  background:#cdd8dc;
}
.panel{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
}
.panel-title{
  padding:3px 0 0;
  text-align:center;
  font-size:17px;
}
.view-wrap{
  position:relative;
  min-height:0;
  width:100%;
  height:100%;
}
.view-svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}

.arrow{
  position:absolute;
  width:54px;
  height:54px;
  border:0;
  background:transparent;
  color:#111;
  font-size:44px;
  font-weight:900;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
}
.arrow.selected{color:#5aa5bf}
.arrow.top{left:50%;top:2%;transform:translateX(-50%)}
.arrow.bottom{left:50%;bottom:2%;transform:translateX(-50%)}
.arrow.left{left:2%;top:50%;transform:translateY(-50%)}
.arrow.right{right:2%;top:50%;transform:translateY(-50%)}

.result{
  min-height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:14px;
  font-weight:700;
}
.result.good{color:var(--good)}
.result.bad{color:var(--bad)}

.next{
  width:min(360px,100%);
  height:38px;
  margin:0 auto 8px;
  border:1px solid #777;
  border-radius:5px;
  background:#efefef;
  color:#111;
  font-size:14px;
  font-weight:700;
}
.next.pressed{background:var(--blue)}

@media(max-width:620px){
  .site-nav{height:40px;padding-top:8px}
  .site-nav a{font-size:10px}
  .app{
    height:calc(100dvh - 40px);
    padding:5px 5px 7px;
  }
  .title{font-size:12px}
  .stats{gap:5px;font-size:8px}
  .stats b{font-size:9px}
  .stage{gap:4px}
  .panel-title{font-size:12px}
  .arrow{
    width:40px;height:40px;
    font-size:33px;
  }
  .arrow.left{left:0}
  .arrow.right{right:0}
  .next{height:35px;margin-bottom:4px}
}
@media(max-height:690px){
  .header{min-height:21px}
  .title{font-size:11px}
  .panel-title{font-size:11px}
  .arrow{width:36px;height:36px;font-size:30px}
  .result{min-height:22px;font-size:12px}
  .next{height:33px}
}
</style>

<body>
<div class="timer-track"><div id="timerFill" class="timer-fill"></div></div>

<nav class="site-nav" aria-label="DLR Training Navigation">

<main class="app">
  <div class="header">
    <div class="title">DLR Räumliches Vorstellungsvermögen</div>
    <div class="stats">
      <span>R <b id="correct">0</b></span>
      <span>F <b id="wrong">0</b></span>
      <span>Quote <b id="rate">0%</b></span>
      <span>Serie <b id="best">0</b></span>
    </div>
  </div>

  <section class="stage">
    <div class="panel">
      <div class="panel-title">Start view</div>
      <div class="view-wrap">
        <svg id="startSvg" class="view-svg" viewBox="0 0 440 360" aria-label="Startansicht"></svg>

        <!-- Pfeil zeigt wie im Referenztest AUF die Figur -->
        <button class="arrow top" data-dir="top" type="button" aria-label="von oben">↓</button>
        <button class="arrow bottom" data-dir="bottom" type="button" aria-label="von unten">↑</button>
        <button class="arrow left" data-dir="left" type="button" aria-label="von links">→</button>
        <button class="arrow right" data-dir="right" type="button" aria-label="von rechts">←</button>
      </div>
    </div>

    <div class="separator"></div>

    <div class="panel">
      <div class="panel-title">Target view</div>
      <div class="view-wrap">
        <svg id="targetSvg" class="view-svg" viewBox="0 0 440 360" aria-label="Zielansicht"></svg>
      </div>
    </div>
  </section>

  <div id="result" class="result"></div>
  <button id="next" class="next" type="button">Next</button>
</main>

<script>
(() => {
  "use strict";

  const ROUND_MS = 60000;

  const startSvg = document.getElementById("startSvg");
  const targetSvg = document.getElementById("targetSvg");
  const result = document.getElementById("result");
  const next = document.getElementById("next");
  const arrows = [...document.querySelectorAll(".arrow")];

  const correctEl = document.getElementById("correct");
  const wrongEl = document.getElementById("wrong");
  const rateEl = document.getElementById("rate");
  const bestEl = document.getElementById("best");

  let stats = {correct:0,wrong:0,streak:0,best:0};
  try{
    const saved = JSON.parse(localStorage.getItem("dlrSpatialStatsV2") || "null");
    if(saved) stats = {...stats,...saved};
  }catch(e){}

  let currentModel = null;
  let answerDir = null;
  let selectedDir = null;
  let evaluated = false;
  let startedAt = 0;
  let raf = 0;

  function saveStats(){
    localStorage.setItem("dlrSpatialStatsV2",JSON.stringify(stats));
    correctEl.textContent = stats.correct;
    wrongEl.textContent = stats.wrong;
    bestEl.textContent = stats.best;
    const total = stats.correct + stats.wrong;
    rateEl.textContent = total ? Math.round(stats.correct/total*100)+"%" : "0%";
  }

  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function v(x,y,z){return {x,y,z}}
  function add(a,b){return v(a.x+b.x,a.y+b.y,a.z+b.z)}
  function sub(a,b){return v(a.x-b.x,a.y-b.y,a.z-b.z)}
  function mul(a,s){return v(a.x*s,a.y*s,a.z*s)}
  function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}
  function cross(a,b){
    return v(
      a.y*b.z-a.z*b.y,
      a.z*b.x-a.x*b.z,
      a.x*b.y-a.y*b.x
    );
  }
  function norm(a){
    const l=Math.hypot(a.x,a.y,a.z)||1;
    return v(a.x/l,a.y/l,a.z/l);
  }

  /*
    Kontrollierte Formenbibliothek.
    Alle Figuren sind bewusst auf ca. 7–10 Knoten begrenzt:
    genug Tiefe, aber keine Zufalls-Knäuel.
  */

        v(-.72,.62,-.22),   // 1

        v(-.72,-.36,.82),   // 4
        v(.58,-.28,.95),    // 5
        v(.02,.34,.42)      // 6
      ],
      e:[
        [0,1],[1,2],[2,3],[3,0],
        [0,4],[1,4],
        [2,5],[3,5],
        [4,5],[4,6],[5,6],
        [1,6],[2,6]
      ]
    },
    {
      name:"offset-prism",
      p:[
        v(-1.20,-.70,-.35),v(.15,-.72,-.22),v(-1.16,.45,-.18),v(.18,.50,-.08),
        v(-.55,-.40,.82),v(.82,-.34,.92),v(-.52,.65,.70),v(.80,.68,.86)
      ],
      e:[
        [0,1],[0,2],[1,3],[2,3],
        [4,5],[4,6],[5,7],[6,7],
        [0,4],[1,5],[2,6],[3,7],
        [1,6]
      ]
    },
    {
      name:"double-tetra",
      p:[
        v(-1.25,-.35,-.25),v(-.42,-.75,-.32),v(-.52,.48,-.12),v(-.42,-.10,.88),
        v(.38,-.55,-.28),v(1.18,-.12,-.22),v(.72,.60,-.05),v(.62,.02,.92)
      ],
      e:[
        [0,1],[0,2],[1,2],[0,3],[1,3],[2,3],
        [4,5],[4,6],[5,6],[4,7],[5,7],[6,7],
        [2,4],[3,7]
      ]
    },
    {
      name:"bridge",
      p:[
        v(-1.28,-.60,-.32),v(-.72,.48,-.22),v(-.08,-.58,-.16),v(.52,.48,-.02),v(1.22,-.54,-.20),
        v(-.68,-.16,.82),v(.02,.25,.98),v(.70,-.12,.78)
      ],
      e:[
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[1,5],[2,5],
        [2,6],[3,6],
        [3,7],[4,7],[6,7]
      ]
    },
    {
      name:"stepped-cage",
      p:[
        v(-1.20,-.70,-.30),v(-.30,-.70,-.20),v(-1.18,.20,-.10),v(-.28,.22,.02),
        v(.25,-.20,.20),v(1.15,-.18,.26),v(.30,.72,.45),v(1.16,.70,.55),
        v(.12,.16,1.02)
      ],
      e:[
        [0,1],[0,2],[1,3],[2,3],
        [3,4],[4,5],[4,6],[5,7],[6,7],
        [3,8],[4,8],[6,8]
      ]
    },
    {
      name:"asym-pyramid",
      p:[
        v(-1.25,-.55,-.35),v(-.20,-.78,-.25),v(.78,-.42,-.20),v(1.12,.42,-.05),v(-.52,.58,-.10),

      ],
      e:[

      ]
    },
    {

      p:[

      ],

      p:[

        v(-.95,.40,-.05),v(-.10,.55,.05),v(.75,.42,.10),
        v(-.20,-.02,.88),v(.65,.02,.72)
      ],
      e:[
        [0,1],[1,2],[2,3],

        [1,7],[5,7],
        [2,8],[6,8],[7,8]
      ]
    },
    {
      name:"twisted-frame",
      p:[
        v(-1.15,-.62,-.38),v(.10,-.72,-.18),v(1.12,-.45,-.12),v(-1.06,.48,-.08),v(.05,.58,.02),v(1.08,.55,.14),
        v(-.48,-.12,.92),v(.62,.10,.78)
      ],
      e:[
        [0,1],[1,2],[0,3],[3,4],[4,5],[2,5],
        [0,6],[3,6],[4,6],
        [1,7],[2,7],[5,7],
        [6,7]
      ]
    },
    {
      name:"tri-bridge",
      p:[
        v(-1.25,-.52,-.28),v(-.45,-.70,-.22),v(.32,-.55,-.15),v(1.16,-.20,-.10),
        v(-.88,.46,-.08),v(.00,.60,.06),v(.86,.48,.16),
        v(-.38,.00,.90),v(.50,.08,.96)
      ],
      e:[
        [0,1],[1,2],[2,3],
        [0,4],[4,5],[5,6],[6,3],
        [1,7],[4,7],[5,7],
        [2,8],[5,8],[6,8],
        [7,8]
      ]
    },
    {
      name:"open-cage",
      p:[
        v(-1.20,-.64,-.30),v(-.20,-.70,-.20),v(.78,-.56,-.15),
        v(-1.08,.36,-.08),v(-.06,.50,.04),v(.94,.38,.10),
        v(-.58,-.06,.88),v(.42,.06,.98)
      ],
      e:[
        [0,1],[1,2],[0,3],[3,4],[4,5],
        [0,6],[1,6],[3,6],[4,6],
        [1,7],[2,7],[4,7],[5,7],
        [6,7]
      ]
    },
    {
      name:"split-tower",
      p:[
        v(-1.10,-.62,-.28),v(-.25,-.65,-.20),v(.68,-.55,-.15),v(1.15,.10,-.04),
        v(-.90,.34,-.02),v(-.08,.52,.12),v(.72,.48,.22),
        v(-.45,-.05,.92),v(.42,.10,1.12)
      ],
      e:[
        [0,1],[1,2],[2,3],
        [0,4],[4,5],[5,6],[6,3],
        [1,7],[4,7],[5,7],
        [2,8],[5,8],[6,8],
        [7,8]
      ]
    }
  ];

  function rotateZ(p,quarterTurns){
    const q=((quarterTurns%4)+4)%4;
    if(q===0) return v(p.x,p.y,p.z);
    if(q===1) return v(-p.y,p.x,p.z);
    if(q===2) return v(-p.x,-p.y,p.z);
    return v(p.y,-p.x,p.z);
  }

  function variant(base){
    const q=Math.floor(Math.random()*4);
    const mirror=Math.random()<0.5 ? -1 : 1;
    return {
      name:base.name,
      p:base.p.map(pt=>{
        const r=rotateZ(pt,q);
        return v(r.x*mirror,r.y,r.z);
      }),
      e:base.e
    };
  }

  /*
    Camera:
    pos = Richtung vom Objekt zum Betrachter.
    up  = "oben" auf dem Bildschirm.
  */
  function camera(pos,up){
    pos=norm(pos);
    let forward=mul(pos,-1);
    let right=norm(cross(forward,up));
    let trueUp=norm(cross(right,forward));
    return {pos,up:trueUp};
  }

  const START_CAMERA = camera(v(1.35,-1.55,1.05),v(0,0,1));

  function basis(cam){
    const forward=mul(cam.pos,-1);
    const right=norm(cross(forward,cam.up));
    const up=norm(cross(right,forward));
    return {forward,right,up};
  }

  /*
    Exakte vier Seiten relativ zur STARTANSICHT.

    Beispiel bei einer Frontkamera:
      left   = Kamera steht links vom Objekt
      right  = Kamera steht rechts
      top    = Kamera steht oberhalb
      bottom = Kamera steht unterhalb

    Für top/bottom wird die Bildschirm-"oben"-Richtung so gesetzt,
    wie bei klassischen orthogonalen 3D-Seitenansichten.
  */
  function targetCamera(dir){
    const b=basis(START_CAMERA);

    if(dir==="left"){
      return camera(mul(b.right,-1),b.up);
    }
    if(dir==="right"){
      return camera(b.right,b.up);
    }
    if(dir==="top"){
      return camera(b.up,mul(START_CAMERA.pos,-1));
    }
    return camera(mul(b.up,-1),START_CAMERA.pos);
  }

  function rawProject(model,cam){
    const b=basis(cam);
    return model.p.map((pt,i)=>({
      i,
      x:dot(pt,b.right),
      y:dot(pt,b.up),
      depth:dot(pt,b.forward)
    }));
  }

  function bbox(points){
    return {
      minX:Math.min(...points.map(p=>p.x)),
      maxX:Math.max(...points.map(p=>p.x)),
      minY:Math.min(...points.map(p=>p.y)),
      maxY:Math.max(...points.map(p=>p.y))
    };
  }

  function commonScale(model,startCam,targetCam){
    const a=bbox(rawProject(model,startCam));
    const b=bbox(rawProject(model,targetCam));
    const maxW=Math.max(a.maxX-a.minX,b.maxX-b.minX,.2);
    const maxH=Math.max(a.maxY-a.minY,b.maxY-b.minY,.2);

    // gleiche Größe für Start + Target
    return Math.min(245/maxW,205/maxH);
  }

  function project(model,cam,scale){
    const raw=rawProject(model,cam);
    const bb=bbox(raw);
    const cx=(bb.minX+bb.maxX)/2;
    const cy=(bb.minY+bb.maxY)/2;

    return raw.map(p=>({
      ...p,
      sx:220+(p.x-cx)*scale,
      sy:185-(p.y-cy)*scale
    }));
  }

  function addDefs(svg){
    const defs=document.createElementNS(NS,"defs");

    const nodeGrad=document.createElementNS(NS,"radialGradient");
    nodeGrad.id="nodeGrad";
    nodeGrad.setAttribute("cx","30%");
    nodeGrad.setAttribute("cy","25%");
    nodeGrad.setAttribute("r","75%");
    [
      ["0%","#dff8fd"],
      ["18%","#82d1e3"],
      ["47%","#238ead"],
      ["78%","#0a6683"],
      ["100%","#06495f"]
    ].forEach(([o,c])=>{
      const s=document.createElementNS(NS,"stop");
      s.setAttribute("offset",o);
      s.setAttribute("stop-color",c);
      nodeGrad.appendChild(s);
    });

    const rodGrad=document.createElementNS(NS,"linearGradient");
    rodGrad.id="rodGrad";
    rodGrad.setAttribute("x1","0");
    rodGrad.setAttribute("y1","0");
    rodGrad.setAttribute("x2","0");
    rodGrad.setAttribute("y2","1");
    [
      ["0%","#82cee0"],
      ["35%","#238ead"],
      ["72%","#0a6683"],
      ["100%","#06495f"]
    ].forEach(([o,c])=>{
      const s=document.createElementNS(NS,"stop");
      s.setAttribute("offset",o);
      s.setAttribute("stop-color",c);
      rodGrad.appendChild(s);
    });

    const shadow=document.createElementNS(NS,"filter");
    shadow.id="shadow";
    shadow.setAttribute("x","-30%");
    shadow.setAttribute("y","-30%");
    shadow.setAttribute("width","160%");
    shadow.setAttribute("height","160%");
    shadow.innerHTML='<feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".22"/>';

    defs.appendChild(nodeGrad);
    defs.appendChild(rodGrad);
    defs.appendChild(shadow);
    svg.appendChild(defs);
  }

  function render(svg,model,cam,scale){
    svg.innerHTML="";
    addDefs(svg);

    const pts=project(model,cam,scale);

    // Kanten nach mittlerer Tiefe sortieren: hinten zuerst
    const edges=model.e.map(([a,b])=>({
      a,b,
      depth:(pts[a].depth+pts[b].depth)/2
    })).sort((x,y)=>x.depth-y.depth);

    edges.forEach(({a,b})=>{
      const A=pts[a],B=pts[b];

      const outer=document.createElementNS(NS,"line");
      outer.setAttribute("x1",A.sx);
      outer.setAttribute("y1",A.sy);
      outer.setAttribute("x2",B.sx);
      outer.setAttribute("y2",B.sy);
      outer.setAttribute("stroke","#05495f");
      outer.setAttribute("stroke-width","9.5");
      outer.setAttribute("stroke-linecap","round");
      outer.setAttribute("filter","url(#shadow)");
      svg.appendChild(outer);

      const inner=document.createElementNS(NS,"line");
      inner.setAttribute("x1",A.sx);
      inner.setAttribute("y1",A.sy);
      inner.setAttribute("x2",B.sx);
      inner.setAttribute("y2",B.sy);
      inner.setAttribute("stroke","url(#rodGrad)");
      inner.setAttribute("stroke-width","6");
      inner.setAttribute("stroke-linecap","round");
      svg.appendChild(inner);

      const shine=document.createElementNS(NS,"line");
      shine.setAttribute("x1",A.sx);
      shine.setAttribute("y1",A.sy-1.3);
      shine.setAttribute("x2",B.sx);
      shine.setAttribute("y2",B.sy-1.3);
      shine.setAttribute("stroke","#bcecf4");
      shine.setAttribute("stroke-opacity",".32");
      shine.setAttribute("stroke-width","1.2");
      shine.setAttribute("stroke-linecap","round");
      svg.appendChild(shine);
    });

    // Kugeln hinten -> vorne
    [...pts].sort((a,b)=>a.depth-b.depth).forEach(P=>{
      const c=document.createElementNS(NS,"circle");
      c.setAttribute("cx",P.sx);
      c.setAttribute("cy",P.sy);
      c.setAttribute("r","12.5");
      c.setAttribute("fill","url(#nodeGrad)");
      c.setAttribute("stroke","#05495f");
      c.setAttribute("stroke-width","1.8");
      c.setAttribute("filter","url(#shadow)");
      svg.appendChild(c);

      const hi=document.createElementNS(NS,"circle");
      hi.setAttribute("cx",P.sx-3.6);
      hi.setAttribute("cy",P.sy-4.2);
      hi.setAttribute("r","3");
      hi.setAttribute("fill","#e7f9fd");
      hi.setAttribute("fill-opacity",".75");
      svg.appendChild(hi);
    });
  }

  function normalizedShape(model,cam){
    const pts=rawProject(model,cam);
    const bb=bbox(pts);
    const cx=(bb.minX+bb.maxX)/2;
    const cy=(bb.minY+bb.maxY)/2;
    const size=Math.max(bb.maxX-bb.minX,bb.maxY-bb.minY,.001);
    return pts.map(p=>({x:(p.x-cx)/size,y:(p.y-cy)/size}));
  }

  function shapeDifference(model,a,b){
    const A=normalizedShape(model,a);
    const B=normalizedShape(model,b);
    let sum=0;
    for(let i=0;i<A.length;i++){
      const dx=A[i].x-B[i].x;
      const dy=A[i].y-B[i].y;
      sum+=dx*dx+dy*dy;
    }
    return Math.sqrt(sum/A.length);
  }

  function chooseTask(){
    const dirs=["top","right","bottom","left"];

    // Verhindert symmetrische / praktisch identische Ansichten.
    for(let attempt=0;attempt<100;attempt++){
      const model=variant(pick(MODELS));
      const dir=pick(dirs);
      const target=targetCamera(dir);

      const correctDiff=shapeDifference(model,START_CAMERA,target);
      if(correctDiff<0.17) continue;

      // Andere Seiten müssen klar anders aussehen als die richtige Zielansicht.
      const alternatives=dirs
        .filter(d=>d!==dir)
        .map(d=>shapeDifference(model,targetCamera(d),target));

      if(Math.min(...alternatives)<0.10) continue;

      currentModel=model;
      answerDir=dir;

      const scale=commonScale(model,START_CAMERA,target);
      render(startSvg,model,START_CAMERA,scale);
      render(targetSvg,model,target,scale);
      return;
    }

    // kontrollierter Fallback
    currentModel=variant(MODELS[0]);
    answerDir="left";
    const target=targetCamera(answerDir);
    const scale=commonScale(currentModel,START_CAMERA,target);
    render(startSvg,currentModel,START_CAMERA,scale);
    render(targetSvg,currentModel,target,scale);
  }

  function setSelected(dir){
    if(evaluated) return;
    selectedDir=dir;
    arrows.forEach(b=>b.classList.toggle("selected",b.dataset.dir===dir));
  }

  function evaluate(timeout=false){
    if(evaluated) return;
    evaluated=true;
    cancelAnimationFrame(raf);
    timerFill.style.width="100%";

    const ok=selectedDir===answerDir;
    const names={top:"oben",right:"rechts",bottom:"unten",left:"links"};

    if(ok){
      stats.correct++;
      stats.streak++;
      stats.best=Math.max(stats.best,stats.streak);
      result.textContent="Richtig";
      result.className="result good";
    }else{
      stats.wrong++;
      stats.streak=0;
      result.textContent=selectedDir
        ? "Falsch · richtig wäre: "+names[answerDir]
        : "Zeit abgelaufen · richtig wäre: "+names[answerDir];
      result.className="result bad";
    }

    saveStats();
    next.textContent="Nächste Aufgabe";
  }

  function tick(){
    if(evaluated) return;
    const elapsed=performance.now()-startedAt;
    const p=Math.min(elapsed/ROUND_MS,1);
    timerFill.style.width=(p*100)+"%";

    if(p>=1){
      evaluate(true);
      return;
    }
    raf=requestAnimationFrame(tick);
  }

  function newTask(){
    cancelAnimationFrame(raf);
    evaluated=false;
    selectedDir=null;
    answerDir=null;
    result.textContent="";
    result.className="result";
    next.textContent="Next";
    timerFill.style.width="0%";
    arrows.forEach(b=>b.classList.remove("selected"));

    chooseTask();

    startedAt=performance.now();
    raf=requestAnimationFrame(tick);
  }

  arrows.forEach(btn=>{
    btn.addEventListener("pointerdown",e=>{
      e.preventDefault();
      setSelected(btn.dataset.dir);
    },{passive:false});
  });

  next.addEventListener("pointerdown",e=>{
    e.preventDefault();
    next.classList.add("pressed");
    setTimeout(()=>next.classList.remove("pressed"),80);

    if(evaluated) newTask();
    else evaluate(false);
  },{passive:false});

  document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

  saveStats();
  newTask();
})();
</script>
</body>
</html>
