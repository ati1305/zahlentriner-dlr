<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zahlentrainer">
  <title>Zahlentrainer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#070b14; --panel:#111827; --panel2:#172033;
      --text:#f8fafc; --muted:#94a3b8; --accent:#2563eb;
      --good:#22c55e; --bad:#ef4444; --border:#334155;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      margin:0; min-height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body {
      min-height:100dvh; display:grid; place-items:center;
      padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
    }
    .app { width:min(100%,620px); }
    h1 { margin:0 0 18px; text-align:center; font-size:clamp(28px,7vw,40px); }
    .card {
      background:var(--panel); border:1px solid var(--border); border-radius:22px;
      padding:20px; box-shadow:0 18px 50px rgba(0,0,0,.35);
    }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:grid; gap:7px; font-size:14px; font-weight:750; }
    select,input,button { width:100%; min-height:52px; border-radius:14px; font:inherit; }
    select,input {
      padding:12px 14px; border:1px solid var(--border);
      background:#0f172a; color:var(--text);
    }
    button {
      border:0; padding:12px 16px; background:var(--accent);
      color:#fff; font-weight:800; cursor:pointer;
    }
    button.secondary { background:#334155; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .stage {
      min-height:300px; margin:18px 0; display:grid; place-items:center;
      border-radius:22px; border:1px solid #1e293b; background:#000; overflow:hidden;
    }
    .digit {
      font-size:clamp(120px,42vw,250px); line-height:1; font-weight:900;
      font-variant-numeric:tabular-nums; user-select:none;
    }
    .answer-area { display:none; gap:12px; margin-top:14px; }
    .answer-area.show { display:grid; }
    .result {
      min-height:30px; margin-top:14px; text-align:center;
      font-size:18px; font-weight:800;
    }
    .good { color:var(--good); } .bad { color:var(--bad); }
    .hint { margin-top:10px; text-align:center; color:var(--muted); font-size:13px; }
    .stats {
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px;
    }
    .stat { padding:10px 6px; border-radius:13px; background:var(--panel2); text-align:center; }
    .stat b { display:block; font-size:20px; }
    .stat span { color:var(--muted); font-size:11px; }
    @media(max-width:500px){
      .row { grid-template-columns:1fr; }
      .stats { grid-template-columns:repeat(2,1fr); }
      .stage { min-height:250px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Zahlentrainer</h1>
    <section class="card">
      <div class="row">
        <label>
          Anzahl Ziffern
          <select id="length">
            <option value="7">7 Ziffern</option>
            <option value="8">8 Ziffern</option>
            <option value="9">9 Ziffern</option>
            <option value="10" selected>10 Ziffern</option>
          </select>
        </label>
        <label>
          Zeit pro Ziffer
          <select id="speed">
            <option value="1000" selected>1 Sekunde</option>
            <option value="2000">2 Sekunden</option>
            <option value="3000">3 Sekunden</option>
            <option value="4000">4 Sekunden</option>
            <option value="5000">5 Sekunden</option>
          </select>
        </label>
      </div>

      <div class="stage">
        <div id="digit" class="digit">–</div>
      </div>

      <button id="start">Start</button>

      <div id="answerArea" class="answer-area">
        <label>
          Gemerkte Zahl eingeben
          <input id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Zahl eingeben">
        </label>
        <div class="row">
          <button id="check">Prüfen</button>
          <button id="show" class="secondary">Lösung zeigen</button>
        </div>
      </div>

      <div id="result" class="result"></div>
      <div class="hint">Start drücken – sofort erscheint die erste Ziffer. Führende Null ist möglich.</div>

      <div class="stats">
        <div class="stat"><b id="correct">0</b><span>Richtig</span></div>
        <div class="stat"><b id="wrong">0</b><span>Falsch</span></div>
        <div class="stat"><b id="rate">0 %</b><span>Quote</span></div>
        <div class="stat"><b id="best">0</b><span>Beste Serie</span></div>
      </div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
let target = "";
let running = false;
const stats = JSON.parse(localStorage.getItem("zahlentrainerStats") || '{"correct":0,"wrong":0,"streak":0,"best":0}');

function saveStats(){
  localStorage.setItem("zahlentrainerStats", JSON.stringify(stats));
  $("correct").textContent = stats.correct;
  $("wrong").textContent = stats.wrong;
  $("best").textContent = stats.best;
  const total = stats.correct + stats.wrong;
  $("rate").textContent = total ? Math.round(stats.correct / total * 100) + " %" : "0 %";
}

function makeDigits(length){
  let s = "";
  for(let i=0;i<length;i++) s += Math.floor(Math.random()*10);
  return s;
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function startRound(){
  if(running) return;
  running = true;
  $("start").disabled = true;
  $("answerArea").classList.remove("show");
  $("answer").value = "";
  $("result").textContent = "";
  $("result").className = "result";

  target = makeDigits(Number($("length").value));
  const perDigit = Number($("speed").value);

  for(const currentDigit of target){
    $("digit").textContent = currentDigit;
    await sleep(perDigit);
    $("digit").textContent = "";
    await sleep(200);
  }

  await sleep(800);
  $("digit").textContent = "?";
  $("answerArea").classList.add("show");
  $("start").disabled = false;
  running = false;
  setTimeout(() => $("answer").focus(), 100);
}

function finish(isCorrect, revealOnly=false){
  if(!$("answerArea").classList.contains("show")) return;

  if(isCorrect){
    stats.correct++;
    stats.streak++;
    stats.best = Math.max(stats.best, stats.streak);
    $("result").textContent = "Richtig ✅";
    $("result").className = "result good";
  } else {
    stats.wrong++;
    stats.streak = 0;
    $("result").textContent = revealOnly ? `Lösung: ${target}` : `Falsch ❌ – richtig war ${target}`;
    $("result").className = "result bad";
  }

  $("answerArea").classList.remove("show");
  $("digit").textContent = "–";
  saveStats();
}

$("start").addEventListener("click", startRound);
$("check").addEventListener("click", () => finish($("answer").value.trim() === target));
$("show").addEventListener("click", () => finish(false, true));
$("answer").addEventListener("keydown", e => {
  if(e.key === "Enter") $("check").click();
});
saveStats();
</script>
</body>
</html>
