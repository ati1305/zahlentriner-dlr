<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zahlentrainer">
  <title>Zahlen-Merktrainer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg:#0b1220;
      --panel:#111827;
      --panel2:#172033;
      --text:#f8fafc;
      --muted:#9ca3af;
      --accent:#2563eb;
      --good:#22c55e;
      --bad:#ef4444;
      --border:#334155;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { min-height:100dvh; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
    .app { width:min(100%,680px); margin:0 auto; padding:20px 0 30px; }
    h1 { margin:0 0 18px; font-size:clamp(26px,7vw,38px); text-align:center; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:22px; padding:18px; box-shadow:0 18px 45px rgba(0,0,0,.25); }
    .grid { display:grid; gap:14px; }
    .two { grid-template-columns:1fr 1fr; }
    label { display:grid; gap:7px; font-weight:700; font-size:14px; }
    select,input,button {
      width:100%; font:inherit; border-radius:14px; min-height:50px;
    }
    select,input { background:#0f172a; color:var(--text); border:1px solid var(--border); padding:12px 14px; }
    button { border:0; background:var(--accent); color:white; font-weight:800; padding:12px 16px; cursor:pointer; }
    button.secondary { background:#334155; }
    button.ghost { background:transparent; border:1px solid var(--border); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .number-stage {
      min-height:220px; display:grid; place-items:center; margin:18px 0;
      background:#020617; border-radius:20px; border:1px solid #1e293b;
      overflow:hidden; padding:18px;
    }
    .number {
      font-weight:900; font-size:clamp(42px,12vw,92px); letter-spacing:.08em;
      text-align:center; white-space:nowrap; font-variant-numeric:tabular-nums;
    }
    .hint { color:var(--muted); text-align:center; font-size:14px; margin-top:8px; }
    .result { min-height:32px; text-align:center; margin-top:12px; font-weight:800; font-size:18px; }
    .good { color:var(--good); }
    .bad { color:var(--bad); }
    .stats {
      margin-top:16px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
    }
    .stat { background:var(--panel2); border-radius:14px; padding:10px 6px; text-align:center; }
    .stat b { display:block; font-size:20px; }
    .stat span { color:var(--muted); font-size:11px; }
    .hidden { display:none !important; }
    .countdown { font-size:64px; font-weight:900; }
    @media (max-width:480px){
      .two { grid-template-columns:1fr; }
      .stats { grid-template-columns:repeat(2,1fr); }
      .number-stage { min-height:200px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Zahlen-Merktrainer</h1>

    <section class="card">
      <div class="grid two">
        <label>
          Ziffern
          <select id="digits">
            <option value="7">7 Ziffern</option>
            <option value="8">8 Ziffern</option>
            <option value="9">9 Ziffern</option>
            <option value="10" selected>10 Ziffern</option>
          </select>
        </label>

        <label>
          Einblendzeit
          <select id="displayTime">
            <option value="5000">5,0 Sekunden</option>
            <option value="3000">3,0 Sekunden</option>
            <option value="2000" selected>2,0 Sekunden</option>
            <option value="1500">1,5 Sekunden</option>
            <option value="1000">1,0 Sekunde</option>
            <option value="700">0,7 Sekunden</option>
            <option value="500">0,5 Sekunden</option>
            <option value="300">0,3 Sekunden</option>
            <option value="200">0,2 Sekunden</option>
          </select>
        </label>
      </div>

      <div class="number-stage" id="stage">
        <div id="number" class="number">Bereit?</div>
      </div>

      <button id="start">Neue Runde</button>

      <div id="answerArea" class="grid hidden" style="margin-top:14px;">
        <label>
          Zahl eingeben
          <input id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Deine Zahl">
        </label>
        <div class="grid two">
          <button id="check">Prüfen</button>
          <button id="show" class="secondary">Lösung zeigen</button>
        </div>
      </div>

      <div id="result" class="result"></div>
      <div class="hint">Führende Null ist erlaubt und bleibt erhalten.</div>

      <div class="stats">
        <div class="stat"><b id="correct">0</b><span>Richtig</span></div>
        <div class="stat"><b id="wrong">0</b><span>Falsch</span></div>
        <div class="stat"><b id="rate">0 %</b><span>Quote</span></div>
        <div class="stat"><b id="best">0</b><span>Beste Serie</span></div>
      </div>

      <button id="reset" class="ghost" style="margin-top:14px;">Statistik zurücksetzen</button>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const digits = $("digits");
    const displayTime = $("displayTime");
    const numberEl = $("number");
    const startBtn = $("start");
    const answerArea = $("answerArea");
    const answer = $("answer");
    const checkBtn = $("check");
    const showBtn = $("show");
    const result = $("result");

    let current = "";
    let timer = null;
    let locked = false;

    const stats = JSON.parse(localStorage.getItem("zahlentrainer-stats") || '{"correct":0,"wrong":0,"streak":0,"best":0}');

    function saveStats() {
      localStorage.setItem("zahlentrainer-stats", JSON.stringify(stats));
      $("correct").textContent = stats.correct;
      $("wrong").textContent = stats.wrong;
      const total = stats.correct + stats.wrong;
      $("rate").textContent = total ? Math.round(stats.correct / total * 100) + " %" : "0 %";
      $("best").textContent = stats.best;
    }

    function randomDigits(length) {
      let out = "";
      for (let i = 0; i < length; i++) out += Math.floor(Math.random() * 10);
      return out;
    }

    function startRound() {
      if (locked) return;
      clearTimeout(timer);
      locked = true;
      current = randomDigits(Number(digits.value));
      answer.value = "";
      result.textContent = "";
      result.className = "result";
      answerArea.classList.add("hidden");
      startBtn.disabled = true;

      numberEl.textContent = "3";
      let count = 3;
      const countdown = setInterval(() => {
        count--;
        if (count > 0) {
          numberEl.textContent = count;
        } else {
          clearInterval(countdown);
          numberEl.textContent = current;
          timer = setTimeout(() => {
            numberEl.textContent = "••••••••••";
            answerArea.classList.remove("hidden");
            startBtn.disabled = false;
            locked = false;
            setTimeout(() => answer.focus(), 50);
          }, Number(displayTime.value));
        }
      }, 500);
    }

    function finish(ok, reveal) {
      if (answerArea.classList.contains("hidden")) return;

      if (ok) {
        stats.correct++;
        stats.streak++;
        stats.best = Math.max(stats.best, stats.streak);
        result.textContent = "Richtig ✅";
        result.className = "result good";
      } else {
        stats.wrong++;
        stats.streak = 0;
        const typed = answer.value || "keine Eingabe";
        result.textContent = reveal ? `Lösung: ${current}` : `Falsch ❌ — richtig war ${current}`;
        result.className = "result bad";
      }

      answerArea.classList.add("hidden");
      numberEl.textContent = current;
      saveStats();
    }

    checkBtn.addEventListener("click", () => finish(answer.value.trim() === current, false));
    showBtn.addEventListener("click", () => finish(false, true));
    startBtn.addEventListener("click", startRound);
    answer.addEventListener("keydown", e => {
      if (e.key === "Enter") checkBtn.click();
    });

    $("reset").addEventListener("click", () => {
      if (confirm("Statistik wirklich zurücksetzen?")) {
        stats.correct = 0;
        stats.wrong = 0;
        stats.streak = 0;
        stats.best = 0;
        saveStats();
        result.textContent = "";
      }
    });

    saveStats();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
