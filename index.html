<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DLR Zahlentrainer</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button{touch-action:manipulation}
html,body{margin:0;min-height:100%;background:#f4f4f4;color:#111;font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:14px}
.app{width:min(100%,680px)}
.panel{background:#fff;border:1px solid #ccc;border-radius:10px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.07)}
h1{margin:0 0 14px;text-align:center;font-size:clamp(24px,6vw,34px)}
label{display:grid;gap:6px;font-size:14px;font-weight:700}
select,button{width:100%;min-height:48px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#111;font:inherit;padding:10px}
button{background:#e8e8e8;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

.stage{
  margin:16px 0;
  min-height:320px;
  display:grid;
  place-items:center;
  background:#fff;
  border:1px solid #bbb;
  border-radius:4px
}
.digit{
  font-size:clamp(150px,45vw,300px);
  line-height:1;
  font-weight:700;
  color:#000;
  font-variant-numeric:tabular-nums;
  user-select:none
}

.answer-area{display:none;margin-top:12px}
.answer-area.show{display:grid}

.hidden-entry{
  width:180px;
  min-height:34px;
  margin:0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#666;
  font-size:13px;
}

.keypad{
  width:180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px
}
.keypad button{
  min-height:48px;
  padding:0;
  border-radius:0;
  border:1px solid #777;
  background:#fff;
  font-size:24px;
  font-weight:400;
  transition:background-color .12s ease
}
.keypad button.pressed{
  background:#bfe3f2 !important
}
.keypad .correction{
  grid-column:1/4;
  min-height:40px;
  margin-top:4px;
  background:#8fc7dc;
  font-size:15px;
  font-weight:700
}
.next-button{
  width:180px;
  margin:10px auto 0;
  min-height:42px;
  border-radius:0;
  border:1px solid #777;
  background:#efefef;
  font-size:16px;
  font-weight:700
}

.top-progress{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:10px;
  background:#e5e5e5;
  z-index:9999;
  display:none
}
.top-progress.show{display:block}
.top-progress-bar{height:100%;width:0%;background:#444}

.result{min-height:28px;margin-top:12px;text-align:center;font-size:18px;font-weight:700}
.good{color:#187a36}
.bad{color:#b42318}
.hint{margin-top:10px;text-align:center;color:#6b7280;font-size:13px}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:14px
}
.stat{border:1px solid #d5d5d5;background:#fafafa;padding:8px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:#6b7280}

@media(max-width:520px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stage{min-height:280px}
}
</style>
</head>

<body>
<div id="topProgress" class="top-progress">
  <div id="topProgressBar" class="top-progress-bar"></div>
</div>

<main class="app">
<section class="panel">

<h1>DLR Zahlentrainer</h1>

<label>
  Anzahl Ziffern
  <select id="length">
    <option value="7">7 Ziffern</option>
    <option value="8">8 Ziffern</option>
    <option value="9">9 Ziffern</option>
    <option value="10" selected>10 Ziffern</option>
  </select>
</label>

<div class="stage">
  <div id="digit" class="digit">–</div>
</div>

<button id="start">Start</button>

<div id="answerArea" class="answer-area">
  <div class="keypad">
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>

    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>

    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>

    <span></span>
    <button data-key="0">0</button>
    <span></span>

    <button id="correction" class="correction">Correction</button>
  </div>

  <button id="next" class="next-button">Next</button>
</div>

<div id="result" class="result"></div>

<div class="stats">
  <div class="stat"><b id="correct">0</b><span>Richtig</span></div>
  <div class="stat"><b id="wrong">0</b><span>Falsch</span></div>
  <div class="stat"><b id="rate">0 %</b><span>Quote</span></div>
  <div class="stat"><b id="best">0</b><span>Beste Serie</span></div>
</div>

</section>
</main>

<script>
const $ = id => document.getElementById(id);

let target = "";
let entered = "";
let running = false;
let answerPhase = false;
let answerTimeout = null;
let progressRAF = null;

const DISPLAY_MS = 1500;
const GAP_MS = 200;
const ANSWER_MS = 20000;

const stats = JSON.parse(
  localStorage.getItem("dlrStatsV8") ||
  '{"correct":0,"wrong":0,"streak":0,"best":0}'
);

function saveStats(){
  localStorage.setItem("dlrStatsV8", JSON.stringify(stats));
  $("correct").textContent = stats.correct;
  $("wrong").textContent = stats.wrong;
  $("best").textContent = stats.best;

  const total = stats.correct + stats.wrong;
  $("rate").textContent = total
    ? Math.round(stats.correct / total * 100) + " %"
    : "0 %";
}

function makeDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

function flashButton(button){
  button.classList.add("pressed");
  setTimeout(() => button.classList.remove("pressed"), 180);
}

function stopAnswerTimer(){
  if(answerTimeout){
    clearTimeout(answerTimeout);
    answerTimeout = null;
  }
  if(progressRAF){
    cancelAnimationFrame(progressRAF);
    progressRAF = null;
  }
}

function startAnswerTimer(){
  stopAnswerTimer();

  const progress = $("topProgress");
  const bar = $("topProgressBar");

  progress.classList.add("show");
  bar.style.width = "0%";

  const started = performance.now();

  function animate(now){
    const pct = Math.min((now - started) / ANSWER_MS, 1);
    bar.style.width = (pct * 100) + "%";

    if(pct < 1){
      progressRAF = requestAnimationFrame(animate);
    }
  }

  progressRAF = requestAnimationFrame(animate);

  answerTimeout = setTimeout(() => {
    finishRound();
  }, ANSWER_MS);
}

async function startRound(){
  if(running || answerPhase) return;

  running = true;
  entered = "";

  $("start").disabled = true;
  $("answerArea").classList.remove("show");
  $("topProgress").classList.remove("show");
  $("topProgressBar").style.width = "0%";
  $("result").textContent = "";
  $("result").className = "result";

  target = makeDigits(Number($("length").value));

  for(const d of target){
    $("digit").textContent = d;
    await sleep(DISPLAY_MS);

    $("digit").textContent = "";
    await sleep(GAP_MS);
  }

  $("digit").textContent = "";
  $("answerArea").classList.add("show");

  running = false;
  answerPhase = true;

  startAnswerTimer();
}

function recordCurrentAnswer(){
  const ok = entered === target;

  if(ok){
    stats.correct++;
    stats.streak++;
    stats.best = Math.max(stats.best, stats.streak);
  }else{
    stats.wrong++;
    stats.streak = 0;
  }

  saveStats();
  return ok;
}

function finishRound(){
  if(!answerPhase) return;

  stopAnswerTimer();
  answerPhase = false;

  const ok = recordCurrentAnswer();

  $("result").textContent = ok
    ? "Richtig"
    : `Falsch – richtig war ${target}`;
  $("result").className = ok
    ? "result good"
    : "result bad";

  $("answerArea").classList.remove("show");
  $("topProgress").classList.remove("show");
  $("topProgressBar").style.width = "0%";
  $("digit").textContent = "–";
  $("start").disabled = false;
}

function nextRoundNow(){
  if(!answerPhase) return;

  stopAnswerTimer();
  answerPhase = false;

  recordCurrentAnswer();

  $("answerArea").classList.remove("show");
  $("topProgress").classList.remove("show");
  $("topProgressBar").style.width = "0%";
  $("result").textContent = "";
  $("digit").textContent = "–";
  $("start").disabled = false;

  setTimeout(startRound, 100);
}

document.querySelectorAll("[data-key]").forEach(button => {
  button.addEventListener("click", () => {
    if(!answerPhase) return;

    flashButton(button);

    const maxLength = Number($("length").value);

    if(entered.length >= maxLength) return;

    entered += button.dataset.key;

    // Eingabe absichtlich NICHT anzeigen.
  });
});

$("correction").addEventListener("click", () => {
  if(!answerPhase) return;

  flashButton($("correction"));

  entered = entered.slice(0, -1);
});

$("next").addEventListener("click", () => {
  if(!answerPhase) return;

  flashButton($("next"));
  nextRoundNow();
});

$("start").addEventListener("click", startRound);

saveStats();

/* Alte GitHub-Pages-Service-Worker/Cache-Versionen entfernen. */
(async () => {
  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(e){}
})();
</script>
</body>
</html>
