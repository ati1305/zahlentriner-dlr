<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DLR Zahlentrainer">
  <title>DLR Zahlentrainer</title>
  <style>
    :root{
      color-scheme: light;
      --bg:#f4f4f4;
      --panel:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --border:#cfcfcf;
      --button:#e5e7eb;
      --button-hover:#d1d5db;
      --good:#187a36;
      --bad:#b42318;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:
        max(16px,env(safe-area-inset-top))
        14px
        max(16px,env(safe-area-inset-bottom));
    }

    .app{
      width:min(100%,680px);
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      padding:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
    }

    h1{
      margin:0 0 16px;
      text-align:center;
      font-size:clamp(24px,6vw,34px);
      font-weight:700;
    }

    .controls{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    label{
      display:grid;
      gap:6px;
      font-size:14px;
      font-weight:700;
    }

    select,input,button{
      width:100%;
      min-height:50px;
      border-radius:8px;
      font:inherit;
    }

    select,input{
      border:1px solid var(--border);
      background:#fff;
      color:#111;
      padding:10px 12px;
    }

    button{
      border:1px solid #bfc3c8;
      background:var(--button);
      color:#111;
      font-weight:700;
      padding:11px 14px;
      cursor:pointer;
    }

    button:hover{
      background:var(--button-hover);
    }

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .stage{
      margin:18px 0;
      min-height:340px;
      display:grid;
      place-items:center;
      background:#fff;
      border:1px solid #bdbdbd;
      border-radius:8px;
      overflow:hidden;
    }

    .digit{
      font-size:clamp(150px,45vw,300px);
      line-height:1;
      font-weight:700;
      color:#000;
      font-variant-numeric:tabular-nums;
      user-select:none;
    }

    .answer-area{
      display:none;
      gap:12px;
      margin-top:14px;
    }

    .answer-area.show{
      display:grid;
    }

    .answer-buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .result{
      min-height:28px;
      margin-top:14px;
      text-align:center;
      font-size:18px;
      font-weight:700;
    }

    .good{ color:var(--good); }
    .bad{ color:var(--bad); }

    .hint{
      margin-top:10px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-top:16px;
    }

    .stat{
      border:1px solid #d5d5d5;
      border-radius:8px;
      background:#fafafa;
      padding:9px 6px;
      text-align:center;
    }

    .stat b{
      display:block;
      font-size:20px;
    }

    .stat span{
      font-size:11px;
      color:var(--muted);
    }

    @media(max-width:520px){
      .controls,
      .answer-buttons{
        grid-template-columns:1fr;
      }

      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .stage{
        min-height:300px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>DLR Zahlentrainer</h1>

      <div class="controls">
        <label>
          Anzahl Ziffern
          <select id="length">
            <option value="7">7 Ziffern</option>
            <option value="8">8 Ziffern</option>
            <option value="9">9 Ziffern</option>
            <option value="10" selected>10 Ziffern</option>
          </select>
        </label>

        <label>
          Zeit pro Ziffer
          <select id="speed">
            <option value="1000" selected>1,0 Sekunden</option>
            <option value="1500">1,5 Sekunden</option>
            <option value="2000">2,0 Sekunden</option>
            <option value="2500">2,5 Sekunden</option>
            <option value="3000">3,0 Sekunden</option>
            <option value="3500">3,5 Sekunden</option>
            <option value="4000">4,0 Sekunden</option>
            <option value="4500">4,5 Sekunden</option>
            <option value="5000">5,0 Sekunden</option>
          </select>
        </label>
      </div>

      <div class="stage">
        <div id="digit" class="digit">–</div>
      </div>

      <button id="start">Start</button>

      <div id="answerArea" class="answer-area">
        <label>
          Gemerkte Zahl
          <input
            id="answer"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            placeholder="Zahl eingeben">
        </label>

        <div class="answer-buttons">
          <button id="check">Prüfen</button>
          <button id="show">Lösung zeigen</button>
        </div>
      </div>

      <div id="result" class="result"></div>

      <div class="hint">
        Ohne Countdown. Jede Ziffer erscheint einzeln. Führende Null ist möglich.
      </div>

      <div class="stats">
        <div class="stat"><b id="correct">0</b><span>Richtig</span></div>
        <div class="stat"><b id="wrong">0</b><span>Falsch</span></div>
        <div class="stat"><b id="rate">0 %</b><span>Quote</span></div>
        <div class="stat"><b id="best">0</b><span>Beste Serie</span></div>
      </div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let target = "";
    let running = false;

    const stats = JSON.parse(
      localStorage.getItem("dlrZahlentrainerStats") ||
      '{"correct":0,"wrong":0,"streak":0,"best":0}'
    );

    function saveStats(){
      localStorage.setItem("dlrZahlentrainerStats", JSON.stringify(stats));

      $("correct").textContent = stats.correct;
      $("wrong").textContent = stats.wrong;
      $("best").textContent = stats.best;

      const total = stats.correct + stats.wrong;
      $("rate").textContent = total
        ? Math.round((stats.correct / total) * 100) + " %"
        : "0 %";
    }

    function makeDigits(length){
      let value = "";
      for(let i = 0; i < length; i++){
        value += Math.floor(Math.random() * 10);
      }
      return value;
    }

    function sleep(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startRound(){
      if(running) return;

      running = true;
      $("start").disabled = true;
      $("answerArea").classList.remove("show");
      $("answer").value = "";
      $("result").textContent = "";
      $("result").className = "result";

      target = makeDigits(Number($("length").value));
      const perDigit = Number($("speed").value);

      for(const currentDigit of target){
        $("digit").textContent = currentDigit;
        await sleep(perDigit);

        $("digit").textContent = "";
        await sleep(200);
      }

      $("digit").textContent = "?";
      $("answerArea").classList.add("show");
      $("start").disabled = false;
      running = false;

      setTimeout(() => $("answer").focus(), 100);
    }

    function finish(isCorrect, revealOnly = false){
      if(!$("answerArea").classList.contains("show")) return;

      if(isCorrect){
        stats.correct += 1;
        stats.streak += 1;
        stats.best = Math.max(stats.best, stats.streak);

        $("result").textContent = "Richtig";
        $("result").className = "result good";
      } else {
        stats.wrong += 1;
        stats.streak = 0;

        $("result").textContent = revealOnly
          ? `Lösung: ${target}`
          : `Falsch – richtig war ${target}`;

        $("result").className = "result bad";
      }

      $("answerArea").classList.remove("show");
      $("digit").textContent = "–";
      saveStats();
    }

    $("start").addEventListener("click", startRound);

    $("check").addEventListener("click", () => {
      finish($("answer").value.trim() === target);
    });

    $("show").addEventListener("click", () => {
      finish(false, true);
    });

    $("answer").addEventListener("keydown", event => {
      if(event.key === "Enter"){
        $("check").click();
      }
    });

    saveStats();
  </script>
</body>
</html>
