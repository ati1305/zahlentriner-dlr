<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DLR Zahlentrainer</title>
<!-- index-fixed-keypad-v3 -->

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;background:#f4f4f4;color:#111;font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh;display:block;padding:8px 12px;overflow:hidden}
.app{width:min(100%,680px)}
.panel{background:#fff;border:1px solid #ccc;border-radius:10px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.07);max-height:calc(100dvh - 58px);overflow:hidden}
h1{margin:0 0 8px;text-align:center;font-size:clamp(20px,3vw,28px)}
label{display:grid;gap:6px;font-size:14px;font-weight:700}
select,button{width:100%;min-height:40px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#111;font:inherit;padding:7px 10px}
button{background:#e8e8e8;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

.stage{
  margin:8px 0;
  height:clamp(180px,36vh,260px);
  display:grid;
  place-items:center;
  background:#fff;
  border:1px solid #bbb;
  border-radius:4px
}
.digit{
  font-size:clamp(110px,28vh,220px);
  line-height:1;
  font-weight:700;
  color:#000;
  font-variant-numeric:tabular-nums;
  user-select:none
}

.answer-area{display:none;margin-top:6px}
.answer-area.show{display:grid}

.hidden-entry{
  width:180px;
  min-height:34px;
  margin:0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#666;
  font-size:13px;
}

.keypad{
  width:222px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:5px
}
.key-row{
  display:flex;
  justify-content:center;
  gap:5px
}
.key-row button{
  width:70px;
  min-height:42px;
  background:#fff;
  border:1px solid #777;
  border-radius:0;
  font-size:24px;
  color:#111;
  padding:0;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent
}
.key-row button.pressed{background:#bfe3f2 !important}
.keypad .correction{
  width:100%;
  min-height:34px;
  border:1px solid #777;
  background:#9ecde2;
  font-size:14px;
  font-weight:700;
  touch-action:manipulation
}
.next-button{
  width:210px;
  margin:6px auto 0;
  min-height:36px;
  border-radius:0;
  border:1px solid #777;
  background:#efefef;
  font-size:16px;
  font-weight:700
}

.top-progress{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:10px;
  background:#e5e5e5;
  z-index:9999;
  display:none
}
.top-progress.show{display:block}
.top-progress-bar{height:100%;width:0%;background:#444}

.result{min-height:22px;margin-top:6px;text-align:center;font-size:15px;font-weight:700;line-height:1.25}
.good{color:#187a36}
.bad{color:#b42318}
.hint{margin-top:10px;text-align:center;color:#6b7280;font-size:13px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.stat{border:1px solid #d5d5d5;background:#fafafa;padding:5px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:#6b7280}

@media(max-width:520px){
  body{padding:6px 8px}
  .panel{padding:9px 10px;max-height:calc(100dvh - 54px)}
  h1{font-size:22px;margin-bottom:7px}
  .stage{
    height:clamp(150px,24vh,190px);
    min-height:0;
    margin:7px 0
  }
  .digit{font-size:clamp(95px,20vh,150px)}
  .keypad{width:210px}
  .key-row button{width:66px;min-height:44px;font-size:25px}
  .keypad .correction{
    grid-column:1/4;
    min-height:38px;
    font-size:15px
  }
  .next-button{width:210px;min-height:38px}
  .stats{grid-template-columns:repeat(4,1fr);gap:4px}
  .stat{padding:4px 2px}
  .stat b{font-size:16px}
  .stat span{font-size:9px}
}

@media (min-width:700px) and (max-height:800px){
  body{padding:4px 10px}
  .panel{padding:8px 12px;max-height:calc(100dvh - 46px)}
  h1{font-size:22px;margin-bottom:6px}
  .stage{height:210px;margin:6px 0}
  .digit{font-size:150px}
  .keypad{width:222px}
  .key-row button{width:70px;min-height:36px;font-size:20px}
  .keypad .correction{min-height:32px;font-size:13px}
  .next-button{width:222px;min-height:36px;margin-top:6px}
  .stats{margin-top:5px}
  .stat b{font-size:16px}
  .stat span{font-size:10px}
}


/* Gemeinsame Navigation */
.site-nav{
  width:min(100%,680px);
  margin:0 auto 6px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.site-nav a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:6px 10px;
  border:1px solid #aaa;
  border-radius:6px;
  background:#fff;
  color:#111;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  touch-action:manipulation;
}
.site-nav a.active{
  background:#bfe3f2;
  border-color:#7fbfd7;
}
@media (min-width:700px) and (max-height:800px){
  .site-nav{margin-bottom:4px}
  .site-nav a{min-height:30px;padding:4px 8px;font-size:13px}
}


.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.exam-info{
  min-height:18px;
  margin-top:5px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#555;
}
@media(max-width:520px){
  .mode-grid{grid-template-columns:1fr 1fr;gap:6px}
  .mode-grid label{font-size:11px}
  .mode-grid select{min-height:34px;padding:5px 6px;font-size:12px}
  .exam-info{font-size:11px;min-height:16px}
}

</style>
</head>

<body>

<nav class="site-nav" aria-label="DLR Training Navigation">
  <a href="index.html" class="active">Zahlen</a>
  <a href="rechnen.html">Rechnen</a>
  <a href="konzentration.html">Konzentration</a>
  <a href="raeumlich.html">Räumlich</a>
</nav>

<div id="topProgress" class="top-progress">
  <div id="topProgressBar" class="top-progress-bar"></div>
</div>

<main class="app" style="margin:0 auto;">
<section class="panel">

<h1>DLR Zahlentrainer</h1>

<div class="mode-grid">
  <label>
    Modus
    <select id="mode">
      <option value="training" selected>Training</option>
      <option value="exam">Prüfungssimulation</option>
    </select>
  </label>

  <label id="lengthLabel">
    Anzahl Ziffern
    <select id="length">
      <option value="6">6 Ziffern</option>
      <option value="7">7 Ziffern</option>
      <option value="8">8 Ziffern</option>
      <option value="9">9 Ziffern</option>
      <option value="10" selected>10 Ziffern</option>
    </select>
  </label>
</div>

<div id="examInfo" class="exam-info"></div>

<div class="stage">
  <div id="digit" class="digit">–</div>
</div>

<button id="start">Start</button>

<div id="answerArea" class="answer-area">
  <div class="keypad">
    <div class="key-row">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
    </div>
    <div class="key-row">
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
    </div>
    <div class="key-row">
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
    </div>
    <div class="key-row">
      <button data-key="0">0</button>
    </div>
    <button id="correction" class="correction">Correction</button>
  </div>

  <button id="next" class="next-button">Bestätigen</button>
</div>

<div id="result" class="result"></div>

<div class="stats">
  <div class="stat"><b id="correct">0</b><span>Richtig</span></div>
  <div class="stat"><b id="wrong">0</b><span>Falsch</span></div>
  <div class="stat"><b id="rate">0 %</b><span>Quote</span></div>
  <div class="stat"><b id="best">0</b><span>Beste Serie</span></div>
</div>

</section>
</main>

<script>
const $ = id => document.getElementById(id);

let target = "";
let entered = "";
let running = false;
let answerPhase = false;
let answerTimeout = null;
let progressRAF = null;
let roundFinished = false;

const EXAM_SEQUENCE = [
  6,6,
  7,7,7,
  8,8,
  9,
  8,
  9,
  8,
  10,10,10,10,10
];
let examIndex = 0;
let examCorrect = 0;
let examWrong = 0;
let examRunning = false;

const DISPLAY_MS = 1500;
const GAP_MS = 200;
const ANSWER_MS = 30000;

const stats = JSON.parse(
  localStorage.getItem("dlrStatsV8") ||
  '{"correct":0,"wrong":0,"streak":0,"best":0}'
);

function saveStats(){
  localStorage.setItem("dlrStatsV8", JSON.stringify(stats));
  $("correct").textContent = stats.correct;
  $("wrong").textContent = stats.wrong;
  $("best").textContent = stats.best;

  const total = stats.correct + stats.wrong;
  $("rate").textContent = total
    ? Math.round(stats.correct / total * 100) + " %"
    : "0 %";
}

function isExamMode(){
  return $("mode").value === "exam";
}

function currentLength(){
  return isExamMode()
    ? EXAM_SEQUENCE[Math.min(examIndex, EXAM_SEQUENCE.length - 1)]
    : Number($("length").value);
}

function updateModeUI(){
  const exam = isExamMode();

  $("lengthLabel").style.opacity = exam ? ".45" : "1";
  $("length").disabled = exam;

  if(exam){
    const pos = Math.min(examIndex + 1, EXAM_SEQUENCE.length);
    const len = EXAM_SEQUENCE[Math.min(examIndex, EXAM_SEQUENCE.length - 1)];
    $("examInfo").textContent = examRunning
      ? `Prüfung ${pos}/${EXAM_SEQUENCE.length} · ${len} Ziffern · ohne Zeitlimit`
      : `16 Aufgaben · ohne Zeitlimit`;
    $("start").textContent = examRunning ? "Prüfung läuft" : "Prüfung starten";
  }else{
    $("examInfo").textContent = "Training · 30 Sekunden Eingabezeit";
    $("start").textContent = "Start";
  }
}

function finishExam(){
  examRunning = false;
  roundFinished = false;
  answerPhase = false;
  running = false;

  $("answerArea").classList.remove("show");
  $("topProgress").classList.remove("show");
  $("topProgressBar").style.width = "0%";
  $("digit").textContent = "–";

  const total = examCorrect + examWrong;
  const quote = total ? Math.round(examCorrect / total * 100) : 0;

  $("result").textContent =
    `Prüfung beendet – ${examCorrect} richtig · ${examWrong} falsch · ${quote} %`;
  $("result").className = examWrong === 0 ? "result good" : "result";

  $("start").disabled = false;
  $("next").textContent = "Bestätigen";

  examIndex = 0;
  updateModeUI();
}

function makeDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

function pressVisual(button){
  button.classList.add("pressed");
}
function releaseVisual(button){
  button.classList.remove("pressed");
}

function stopAnswerTimer(){
  if(answerTimeout){
    clearTimeout(answerTimeout);
    answerTimeout = null;
  }
  if(progressRAF){
    cancelAnimationFrame(progressRAF);
    progressRAF = null;
  }
}

function startAnswerTimer(){
  stopAnswerTimer();

  if(isExamMode()){
    $("topProgress").classList.remove("show");
    $("topProgressBar").style.width = "0%";
    return;
  }

  const progress = $("topProgress");
  const bar = $("topProgressBar");

  progress.classList.add("show");
  bar.style.width = "0%";

  const started = performance.now();

  function animate(now){
    const pct = Math.min((now - started) / ANSWER_MS, 1);
    bar.style.width = (pct * 100) + "%";

    if(pct < 1){
      progressRAF = requestAnimationFrame(animate);
    }
  }

  progressRAF = requestAnimationFrame(animate);

  answerTimeout = setTimeout(() => {
    finishRound();
  }, ANSWER_MS);
}

async function startRound(){
  if(running || answerPhase) return;

  if(isExamMode() && !examRunning){
    examRunning = true;
    examIndex = 0;
    examCorrect = 0;
    examWrong = 0;
  }

  running = true;
  entered = "";
  roundFinished = false;

  $("start").disabled = true;
  $("next").textContent = "Bestätigen";
  updateModeUI();
  $("answerArea").classList.remove("show");
  $("topProgress").classList.remove("show");
  $("topProgressBar").style.width = "0%";
  $("result").textContent = "";
  $("result").className = "result";

  target = makeDigits(currentLength());

  for(const d of target){
    $("digit").textContent = d;
    await sleep(DISPLAY_MS);

    $("digit").textContent = "";
    await sleep(GAP_MS);
  }

  $("digit").textContent = "";
  $("answerArea").classList.add("show");

  running = false;
  answerPhase = true;

  document.querySelectorAll("[data-key]").forEach(btn => btn.disabled = false);
  $("correction").disabled = false;
  $("next").textContent = "Bestätigen";

  startAnswerTimer();
}

function recordCurrentAnswer(){
  const ok = entered === target;

  if(ok){
    stats.correct++;
    stats.streak++;
    stats.best = Math.max(stats.best, stats.streak);
  }else{
    stats.wrong++;
    stats.streak = 0;
  }

  if(isExamMode() && examRunning){
    if(ok) examCorrect++;
    else examWrong++;
  }

  saveStats();
  return ok;
}

function finishRound(){
  if(!answerPhase) return;

  stopAnswerTimer();
  answerPhase = false;
  roundFinished = true;

  const ok = recordCurrentAnswer();
  const shownEntry = entered.length ? entered : "keine Eingabe";

  const examPrefix = isExamMode()
    ? `Aufgabe ${examIndex + 1}/${EXAM_SEQUENCE.length} · `
    : "";

  $("result").textContent = ok
    ? `${examPrefix}Richtig – ${target}`
    : `${examPrefix}Falsch – deine Eingabe: ${shownEntry} · richtig: ${target}`;
  $("result").className = ok ? "result good" : "result bad";

  document.querySelectorAll("[data-key]").forEach(btn => btn.disabled = true);
  $("correction").disabled = true;

  $("topProgress").classList.remove("show");
  $("topProgressBar").style.width = "0%";
  $("digit").textContent = "–";

  $("next").textContent = "Nächste Aufgabe";
  $("start").disabled = true;
}

function nextRoundNow(){
  if(!roundFinished) return;

  roundFinished = false;

  document.querySelectorAll("[data-key]").forEach(btn => btn.disabled = false);
  $("correction").disabled = false;

  $("answerArea").classList.remove("show");
  $("result").textContent = "";
  $("result").className = "result";
  $("digit").textContent = "–";
  $("next").textContent = "Bestätigen";

  if(isExamMode() && examRunning){
    examIndex++;

    if(examIndex >= EXAM_SEQUENCE.length){
      finishExam();
      return;
    }

    $("start").disabled = true;
    updateModeUI();
    setTimeout(startRound, 100);
    return;
  }

  $("start").disabled = false;
  setTimeout(startRound, 100);
}

document.querySelectorAll("[data-key]").forEach(button => {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    if(!answerPhase) return;

    pressVisual(button);

    const maxLength = currentLength();
    if(entered.length >= maxLength) return;

    entered += button.dataset.key;
  });

  const release = () => releaseVisual(button);
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("pointerleave", release);
});

$("correction").addEventListener("pointerdown", event => {
  event.preventDefault();
  if(!answerPhase) return;

  pressVisual($("correction"));
  entered = entered.slice(0, -1);
});
["pointerup","pointercancel","pointerleave"].forEach(evt => {
  $("correction").addEventListener(evt, () => releaseVisual($("correction")));
});

$("next").addEventListener("pointerdown", event => {
  event.preventDefault();

  pressVisual($("next"));

  if(answerPhase){
    finishRound();
    return;
  }

  if(roundFinished){
    nextRoundNow();
  }
});
["pointerup","pointercancel","pointerleave"].forEach(evt => {
  $("next").addEventListener(evt, () => releaseVisual($("next")));
});

$("start").addEventListener("pointerdown", event => {
  event.preventDefault();
  startRound();
});

$("mode").addEventListener("change", () => {
  if(running || answerPhase || roundFinished || examRunning){
    $("mode").value = examRunning ? "exam" : "training";
    return;
  }
  examIndex = 0;
  examCorrect = 0;
  examWrong = 0;
  updateModeUI();
});

saveStats();
updateModeUI();

/* Alte GitHub-Pages-Service-Worker/Cache-Versionen entfernen. */
(async () => {
  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(e){}
})();
</script>
</body>
</html>
