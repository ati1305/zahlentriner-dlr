<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Zahlentrainer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      color-scheme:dark;
      --bg:#070b14; --panel:#111827; --text:#f8fafc;
      --muted:#94a3b8; --accent:#2563eb; --good:#22c55e; --bad:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:grid; place-items:center; padding:20px;
    }
    .app{width:min(100%,560px)}
    h1{text-align:center;margin:0 0 18px}
    .card{
      background:var(--panel); border-radius:22px; padding:20px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:grid;gap:6px;font-weight:700}
    select,input,button{
      width:100%; min-height:52px; border-radius:14px; font:inherit;
    }
    select,input{
      background:#0f172a; color:#fff; border:1px solid #334155; padding:12px 14px;
    }
    button{
      border:0; background:var(--accent); color:#fff; font-weight:800;
      padding:12px 16px; cursor:pointer;
    }
    button.secondary{background:#334155}
    button:disabled{opacity:.45}
    .stage{
      min-height:260px; margin:18px 0; border-radius:20px;
      background:#000; display:grid; place-items:center;
      border:1px solid #1e293b;
    }
    .digit{
      font-size:clamp(100px,34vw,220px);
      line-height:1; font-weight:900; font-variant-numeric:tabular-nums;
    }
    .info{text-align:center;color:var(--muted);margin-top:10px}
    .answer{display:none;gap:12px}
    .answer.show{display:grid}
    .result{text-align:center;min-height:30px;margin-top:14px;font-weight:800;font-size:18px}
    .good{color:var(--good)} .bad{color:var(--bad)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
    .stat{background:#172033;padding:10px;border-radius:12px;text-align:center}
    .stat b{display:block;font-size:20px}
    .stat span{font-size:11px;color:var(--muted)}
    @media(max-width:480px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <h1>Zahlentrainer</h1>
    <section class="card">
      <div class="row">
        <label>
          Anzahl Ziffern
          <select id="length">
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10" selected>10</option>
          </select>
        </label>
        <label>
          Zeit pro Ziffer
          <select id="speed">
            <option value="1500">1,5 Sekunden</option>
            <option value="1000" selected>1 Sekunde</option>
            <option value="750">0,75 Sekunden</option>
            <option value="500">0,5 Sekunden</option>
          </select>
        </label>
      </div>

      <div class="stage">
        <div id="digit" class="digit">–</div>
      </div>

      <button id="start">Start</button>

      <div id="answerArea" class="answer">
        <label>
          Gemerkte Zahl eingeben
          <input id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </label>
        <div class="row">
          <button id="check">Prüfen</button>
          <button id="show" class="secondary">Lösung</button>
        </div>
      </div>

      <div id="result" class="result"></div>
      <div class="info">Jede Ziffer wird einzeln angezeigt. Führende Null ist möglich.</div>

      <div class="stats">
        <div class="stat"><b id="correct">0</b><span>Richtig</span></div>
        <div class="stat"><b id="wrong">0</b><span>Falsch</span></div>
        <div class="stat"><b id="rate">0 %</b><span>Quote</span></div>
      </div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
let target = "";
let running = false;
let stats = JSON.parse(localStorage.getItem("digitTrainerStats") || '{"correct":0,"wrong":0}');

function makeDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}

function updateStats(){
  $("correct").textContent = stats.correct;
  $("wrong").textContent = stats.wrong;
  const total = stats.correct + stats.wrong;
  $("rate").textContent = total ? Math.round(stats.correct/total*100) + " %" : "0 %";
  localStorage.setItem("digitTrainerStats", JSON.stringify(stats));
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function startRound(){
  if(running) return;
  running = true;
  $("start").disabled = true;
  $("answerArea").classList.remove("show");
  $("answer").value = "";
  $("result").textContent = "";
  $("result").className = "result";
  $("digit").textContent = "3";
  await sleep(500);
  $("digit").textContent = "2";
  await sleep(500);
  $("digit").textContent = "1";
  await sleep(500);

  target = makeDigits(Number($("length").value));
  const perDigit = Number($("speed").value);

  for(const d of target){
    $("digit").textContent = d;
    await sleep(perDigit);
    $("digit").textContent = "";
    await sleep(120);
  }

  $("digit").textContent = "?";
  $("answerArea").classList.add("show");
  $("answer").focus();
  $("start").disabled = false;
  running = false;
}

function finish(ok, reveal=false){
  if(!$("answerArea").classList.contains("show")) return;
  if(ok){
    stats.correct++;
    $("result").textContent = "Richtig ✅";
    $("result").className = "result good";
  }else{
    stats.wrong++;
    $("result").textContent = reveal ? `Lösung: ${target}` : `Falsch ❌ – richtig war ${target}`;
    $("result").className = "result bad";
  }
  $("answerArea").classList.remove("show");
  $("digit").textContent = "–";
  updateStats();
}

$("start").addEventListener("click", startRound);
$("check").addEventListener("click", () => finish($("answer").value.trim() === target));
$("show").addEventListener("click", () => finish(false, true));
$("answer").addEventListener("keydown", e => {
  if(e.key === "Enter") $("check").click();
});
updateStats();
</script>
</body>
</html>
