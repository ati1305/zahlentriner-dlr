<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DLR Rechentrainer</title>

  <style>
    :root{
      --vh:1vh;
      --blue:#d9efff;
      --blue2:#8ecbf4;
      --slot:#ececec;
      --line:#d5d5d5;
      --good:#167a38;
      --bad:#b3261e;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#fff;
      color:#111;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      touch-action:manipulation;
      overscroll-behavior:none;
    }

    body{
      min-height:calc(var(--vh) * 100);
      display:block;
      user-select:none;
      -webkit-user-select:none;
    }

    button{font:inherit}

    .app{
      height:calc(var(--vh) * 100 - 46px);
      display:grid;
      grid-template-rows:8px auto minmax(0,1fr);
      background:#fff;
    }

    .timer-track{
      width:100%;
      height:8px;
      background:#eee;
      overflow:hidden;
    }

    .timer-fill{
      height:100%;
      width:0%;
      background:#111;
      will-change:width;
    }

    .top{
      padding:clamp(8px,1.4vh,14px) clamp(10px,3vw,24px) 0;
    }

    .header-row{
      min-height:30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .title{
      font-size:clamp(14px,2vw,19px);
      font-weight:700;
      white-space:nowrap;
    }

    .stats{
      display:flex;
      justify-content:flex-end;
      gap:clamp(7px,1.8vw,16px);
      flex-wrap:wrap;
      font-size:clamp(10px,1.6vw,14px);
      font-variant-numeric:tabular-nums;
    }

    .stats b{font-weight:800}

    .main{
      min-height:0;
      display:grid;
      grid-template-rows:minmax(120px,1fr) auto;
      gap:10px;
      padding:6px clamp(8px,2.5vw,22px) clamp(10px,1.6vh,16px);
    }

    .task-area{
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:6px;
    }

    .equation{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(5px,1vw,12px);
      white-space:nowrap;
      max-width:100%;
      font-size:clamp(31px,min(6vw,8vh),70px);
      line-height:1;
      font-weight:500;
      font-variant-numeric:tabular-nums;
    }

    .number-token{
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .slot{
      width:1.05em;
      height:1.08em;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:var(--slot);
      border:0;
      border-bottom:2px solid #bdbdbd;
      color:#111;
      font-size:1em;
      font-weight:500;
      line-height:1;
      padding:0;
      cursor:pointer;
      touch-action:manipulation;
      flex:0 0 auto;
    }

    .slot.selected{
      background:var(--blue);
      border-bottom-color:var(--blue2);
    }

    .slot.filled{
      background:var(--blue);
      border-bottom-color:transparent;
    }

    .controls{
      width:min(690px,100%);
      margin:0 auto;
      align-self:end;
    }

    .next{
      width:100%;
      appearance:none;
      -webkit-appearance:none;
      border:2px solid #111;
      border-radius:10px;
      background:#fff;
      color:#111;
      height:clamp(48px,7vh,60px);
      font-size:clamp(16px,2.5vh,20px);
      font-weight:800;
      cursor:pointer;
      touch-action:manipulation;
      transition:background-color 70ms linear,transform 45ms linear;
    }

    .next.pressed{
      background:var(--blue);
      transform:scale(.99);
    }

    .popup{
      position:fixed;
      z-index:20;
      display:none;
      grid-template-columns:1fr;
      gap:6px;
      width:72px;
      padding:8px;
      background:#fff;
      border:1px solid #aaa;
      border-radius:12px;
      box-shadow:0 8px 28px rgba(0,0,0,.18);
    }

    .popup.show{
      display:grid;
    }

    .popup-btn{
      appearance:none;
      -webkit-appearance:none;
      border:1.5px solid #111;
      border-radius:9px;
      background:#fff;
      color:#111;
      height:58px;
      font-size:30px;
      font-weight:800;
      cursor:pointer;
      touch-action:manipulation;
      transition:background-color 70ms linear,transform 45ms linear;
    }

    .popup-btn.pressed{
      background:var(--blue);
      transform:scale(.97);
    }

    .feedback{
      position:fixed;
      z-index:30;
      left:50%;
      top:clamp(62px,10vh,92px);
      transform:translateX(-50%);
      padding:7px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      font-size:clamp(13px,2vw,16px);
      font-weight:800;
      opacity:0;
      pointer-events:none;
      transition:opacity 120ms ease;
      white-space:nowrap;
    }

    .feedback.show{opacity:1}
    .feedback.good{color:var(--good)}
    .feedback.bad{color:var(--bad)}

    @media(max-width:520px){
      .top{
        padding-left:8px;
        padding-right:8px;
      }

      .header-row{
        align-items:flex-start;
      }

      .title{font-size:14px}

      .stats{
        max-width:72%;
        gap:6px 8px;
        font-size:10px;
      }

      .main{
        padding-left:7px;
        padding-right:7px;
      }

      .equation{
        gap:4px;
        font-size:clamp(29px,8vw,43px);
      }

      .popup{
        width:68px;
      }

      .popup-btn{
        height:56px;
        font-size:29px;
      }
    }

    @media(max-height:680px){
      .app{
        grid-template-rows:6px auto minmax(0,1fr);
      }

      .timer-track{height:6px}

      .top{padding-top:5px}

      .main{
        grid-template-rows:minmax(80px,.8fr) auto;
        gap:5px;
        padding-top:3px;
        padding-bottom:6px;
      }

      .equation{
        font-size:clamp(26px,7vh,48px);
      }

      .next{
        height:44px;
      }
    }

    .task-settings{
      width:min(690px,100%);
      margin:4px auto 0;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      font-size:13px;
      font-weight:700;
    }

    .task-settings label{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .task-settings select{
      min-height:32px;
      border:1px solid #aaa;

      background:#fff;
      color:#111;
      padding:4px 8px;
      font:inherit;
    }

    .solution-line{
      min-height:34px;
      margin:0 auto 4px;

      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:clamp(13px,2vw,16px);
      font-weight:700;
      color:#333;

    }

</style>

<body>

<nav class="site-nav" aria-label="DLR Training Navigation">
  <a href="index.html">Zahlentrainer</a>
  <a href="rechnen.html" class="active">Rechentrainer</a>
</nav>


<div class="task-settings">
  <label>
    Zahlen:
    <select id="numberCountSelect" aria-label="Anzahl Zahlen für die nächste Aufgabe">
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5" selected>5</option>
    </select>
  </label>
</div>

<div class="app">
  <div class="timer-track">
    <div id="timerFill" class="timer-fill"></div>
  </div>

  <div class="top">
    <div class="header-row">
      <div class="title">DLR Rechentrainer</div>

      <div class="stats">
        <span>Richtig <b id="correctCount">0</b></span>
        <span>Falsch <b id="wrongCount">0</b></span>
        <span>Quote <b id="accuracy">0%</b></span>
        <span>Serie <b id="bestStreak">0</b></span>
      </div>
    </div>
  </div>

  <main class="main">
    <section class="task-area">
      <div id="equation" class="equation"></div>
    </section>

    <div id="solutionLine" class="solution-line"></div>

    <section class="controls">
      <button id="nextBtn" class="next" type="button">Next</button>
    </section>
  </main>

  <div id="operatorPopup" class="popup">
    <button class="popup-btn" data-op="+" type="button">+</button>
    <button class="popup-btn" data-op="-" type="button">−</button>
    <button class="popup-btn" data-op="*" type="button">×</button>
    <button class="popup-btn" data-op="/" type="button">÷</button>
  </div>

  <div id="feedback" class="feedback"></div>
</div>

<script>
(() => {
  "use strict";

  const ROUND_MS = 60000;
  const FEEDBACK_MS = 2200;
  const MIN_NUMBERS = 3;
  const MAX_NUMBERS = 5;
  const MAX_ABS_RESULT = 999;

  const equationEl = document.getElementById("equation");
  const timerFill = document.getElementById("timerFill");
  const nextBtn = document.getElementById("nextBtn");
  const popup = document.getElementById("operatorPopup");
  const feedbackEl = document.getElementById("feedback");
  const solutionLineEl = document.getElementById("solutionLine");
  const numberCountSelect = document.getElementById("numberCountSelect");

  const correctCountEl = document.getElementById("correctCount");
  const wrongCountEl = document.getElementById("wrongCount");
  const accuracyEl = document.getElementById("accuracy");
  const bestStreakEl = document.getElementById("bestStreak");

  let numbers = [];
  let target = 0;
  let enteredOps = [];
  let selectedGap = -1;

  // Hidden mathematical grouping used by the task generator.
  // Never rendered and never entered by the user.
  let hiddenGroupStart = null;
  let hiddenGroupEnd = null;
  let solutionOps = [];

  let roundActive = false;
  let timeExpired = false;
  let resultCounted = false;
  let roundStart = 0;
  let animationFrame = 0;
  let roundToken = 0;

  let correct = 0;
  let wrong = 0;
  let currentStreak = 0;
  let bestStreak = 0;

  function setViewportHeight(){
    document.documentElement.style.setProperty("--vh", `${window.innerHeight * .01}px`);
  }

  setViewportHeight();

  window.addEventListener("resize", setViewportHeight, {passive:true});
  window.addEventListener("orientationchange", () => {
    setTimeout(setViewportHeight, 60);
  }, {passive:true});

  function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function pick(arr){
    return arr[Math.floor(Math.random()*arr.length)];
  }

  function symbol(op){
    if(op==="*") return "×";
    if(op==="/") return "÷";
    if(op==="-") return "−";
    return op;
  }

  function precedence(op){
    return (op==="*" || op==="/") ? 2 : 1;
  }

  function applyOp(a,b,op){
    if(op==="+") return a+b;
    if(op==="-") return a-b;
    if(op==="*") return a*b;
    if(op==="/") return b===0 ? NaN : a/b;
    return NaN;
  }

  function evaluateExpression(nums,ops){
    if(ops.length !== nums.length-1) return NaN;

    const values=[nums[0]];
    const operators=[];

    function reduce(){
      const op=operators.pop();
      const b=values.pop();
      const a=values.pop();
      values.push(applyOp(a,b,op));
    }

    for(let i=0;i<ops.length;i++){
      const op=ops[i];

      while(
        operators.length &&
        precedence(operators[operators.length-1]) >= precedence(op)
      ){
        reduce();
      }

      operators.push(op);
      values.push(nums[i+1]);
    }

    while(operators.length) reduce();

    return values.length===1 ? values[0] : NaN;
  }

  function evaluateWithHiddenGroup(nums,ops,start,end){
    if(start===null || end===null){
      return evaluateExpression(nums,ops);
    }

    const groupedNums=nums.slice(start,end+1);
    const groupedOps=ops.slice(start,end);
    const groupedValue=evaluateExpression(groupedNums,groupedOps);

    if(!Number.isFinite(groupedValue)) return NaN;

    const reducedNums=[
      ...nums.slice(0,start),
      groupedValue,
      ...nums.slice(end+1)
    ];

    const reducedOps=[
      ...ops.slice(0,start),
      ...ops.slice(end)
    ];

    return evaluateExpression(reducedNums,reducedOps);
  }

  function allOperatorCombinations(slotCount){
    const result=[];
    const ops=["+","-","*","/"];

    function walk(current){
      if(current.length===slotCount){
        result.push(current.slice());
        return;
      }

      for(const op of ops){
        current.push(op);
        walk(current);
        current.pop();
      }
    }

    walk([]);
    return result;
  }

  function possibleGroups(numberCount){
    const groups=[{start:null,end:null}];

    for(let start=0;start<numberCount-1;start++){
      for(let end=start+1;end<numberCount;end++){
        const length=end-start+1;

        if(length>=2 && length<=Math.min(4,numberCount)){
          groups.push({start,end});
        }
      }
    }

    return groups;
  }

  function countValidInterpretations(nums,wantedTarget){
    const allOps=allOperatorCombinations(nums.length-1);
    const groups=possibleGroups(nums.length);
    let count=0;

    for(const ops of allOps){
      for(const group of groups){
        const value=evaluateWithHiddenGroup(
          nums,
          ops,
          group.start,
          group.end
        );

        if(
          Number.isFinite(value) &&
          Number.isInteger(value) &&
          Math.abs(value-wantedTarget)<1e-9
        ){
          count++;

          if(count>1) return count;
        }
      }
    }

    return count;
  }


  function createHiddenOps(numberCount){
    const slotCount=numberCount-1;

    // Leichtere DLR-artige Mischung:
    // höchstens zwei Multiplikationen/Divisionen insgesamt.
    for(let attempt=0;attempt<200;attempt++){
      const ops=Array.from(
        {length:slotCount},
        () => pick(["+","-","+","-","*","/"])
      );

      const highCount=ops.filter(op=>op==="*" || op==="/").length;

      if(highCount<=2){
        return ops;
      }
    }

    return Array.from({length:slotCount},()=>pick(["+","-"]));
  }

  function chooseHiddenGroup(numberCount){
    // Klammern nur gelegentlich und immer nur um GENAU zwei
    // benachbarte Zahlen. Dadurch bleiben die Aufgaben schnell lösbar.
    if(numberCount<3 || Math.random()<0.65){
      return {start:null,end:null};
    }

    const start=randInt(0,numberCount-2);
    return {start:start,end:start+1};
  }

  function intendedPathIsReasonable(nums,ops,group){
    // Keine großen oder krummen Zwischenrechnungen.
    if(group.start!==null){
      const innerNums=nums.slice(group.start,group.end+1);
      const innerOps=ops.slice(group.start,group.end);
      const innerValue=evaluateExpression(innerNums,innerOps);

      if(!Number.isFinite(innerValue)) return false;
      if(!Number.isInteger(innerValue)) return false;
      if(innerValue<0 || innerValue>60) return false;
    }

    // Divisionen sollen in der vorgesehenen Aufgabe möglichst "glatt" sein.
    for(let i=0;i<ops.length;i++){
      if(ops[i]==="/"){
        const a=nums[i];
        const b=nums[i+1];
        if(b===0) return false;

        // Bei einer sichtbaren lokalen Division bevorzugen wir ganzzahlige Ergebnisse.
        if(a % b !== 0 && !(group.start===i && group.end===i+1)){
          return false;
        }
      }
    }

    const highCount=ops.filter(op=>op==="*" || op==="/").length;
    if(highCount>2) return false;

    return true;
  }

  function generateTask(){
    for(let attempt=0;attempt<6000;attempt++){
      const numberCount=Number(numberCountSelect.value);

      // Kleinere Zahlen, damit Kopfrechnen in 60 Sekunden realistisch bleibt.
      const nums=Array.from(
        {length:numberCount},
        () => randInt(2,12)
      );

      const hiddenOps=createHiddenOps(numberCount);
      const group=chooseHiddenGroup(numberCount);

      if(!intendedPathIsReasonable(nums,hiddenOps,group)) continue;

      const result=evaluateWithHiddenGroup(
        nums,
        hiddenOps,
        group.start,
        group.end
      );

      if(!Number.isFinite(result)) continue;
      if(!Number.isInteger(result)) continue;

      // Kein negatives Ergebnis.
      if(result<0) continue;

      // Technisch weiterhin maximal dreistellig,
      // praktisch aber bevorzugt deutlich kleinere Ergebnisse.
      if(result>300) continue;

      // Extrem triviale Nullaufgaben selten zulassen.
      if(result===0 && Math.random()<0.85) continue;

      // Nur Aufgaben mit einer eindeutigen Interpretation akzeptieren.
      if(countValidInterpretations(nums,result)!==1) continue;

      return {
        numbers:nums,
        target:result,
        groupStart:group.start,
        groupEnd:group.end,
        solutionOps:hiddenOps
      };
    }

    // Einfacher Fallback:
    // (7 + 2) × 3 = 27
    return {
      numbers:[7,2,3],
      target:27,
      groupStart:0,
      groupEnd:1,
      solutionOps:["+","*"]
    };
  }

  function renderEquation(){
    equationEl.innerHTML="";

    numbers.forEach((num,index)=>{
      const n=document.createElement("span");
      n.className="number-token";
      n.textContent=String(num);
      equationEl.appendChild(n);

      if(index<numbers.length-1){
        const slot=document.createElement("button");
        slot.type="button";
        slot.className="slot";
        slot.dataset.gap=String(index);

        if(enteredOps[index]){
          slot.textContent=symbol(enteredOps[index]);
          slot.classList.add("filled");
        }else{
          slot.textContent="?";
        }

        if(index===selectedGap && popup.classList.contains("show")){
          slot.classList.add("selected");
        }

        slot.addEventListener("pointerdown",(event)=>{
          event.preventDefault();
          if(!roundActive) return;
          openPopupForGap(index,slot);
        },{passive:false});

        equationEl.appendChild(slot);
      }
    });

    const equal=document.createElement("span");
    equal.textContent="=";
    equationEl.appendChild(equal);

    const result=document.createElement("span");
    result.textContent=String(target);
    equationEl.appendChild(result);
  }

  function openPopupForGap(index,slot){
    selectedGap=index;
    popup.classList.add("show");

    const rect=slot.getBoundingClientRect();
    const popupWidth=window.innerWidth<=520 ? 68 : 72;
    const popupHeight=(58*4)+(6*3)+16;

    // Popup opens as a vertical column directly below the selected field.
    let left=rect.left + rect.width/2 - popupWidth/2;
    left=Math.max(8,Math.min(left,window.innerWidth-popupWidth-8));

    let top=rect.bottom+8;

    // Keep it on-screen while preserving the downward vertical layout.
    if(top+popupHeight>window.innerHeight-8){
      top=Math.max(8,window.innerHeight-popupHeight-8);
    }

    popup.style.width=`${popupWidth}px`;
    popup.style.left=`${left}px`;
    popup.style.top=`${top}px`;

    renderEquation();
  }

  function closePopup(){
    popup.classList.remove("show");
    selectedGap=-1;
    renderEquation();
  }

  function chooseOperator(op){
    if(!roundActive || selectedGap<0) return;

    enteredOps[selectedGap]=op;
    closePopup();
  }

  function flash(button){
    button.classList.add("pressed");
    setTimeout(()=>button.classList.remove("pressed"),90);
  }

  document.querySelectorAll(".popup-btn").forEach(button=>{
    button.addEventListener("pointerdown",(event)=>{
      event.preventDefault();
      event.stopPropagation();
      flash(button);
      chooseOperator(button.dataset.op);
    },{passive:false});
  });

  document.addEventListener("pointerdown",(event)=>{
    if(
      popup.classList.contains("show") &&
      !popup.contains(event.target) &&
      !event.target.classList.contains("slot")
    ){
      closePopup();
    }
  },{passive:true});

  function updateStats(){
    const total=correct+wrong;
    const accuracy=total ? Math.round(correct/total*100) : 0;

    correctCountEl.textContent=String(correct);
    wrongCountEl.textContent=String(wrong);
    accuracyEl.textContent=`${accuracy}%`;
    bestStreakEl.textContent=String(bestStreak);
  }

  function showFeedback(isCorrect){
    feedbackEl.className="feedback";
    feedbackEl.textContent=isCorrect ? "Richtig" : "Falsch";
    feedbackEl.classList.add(isCorrect ? "good" : "bad","show");

    setTimeout(()=>{
      feedbackEl.classList.remove("show");
    },FEEDBACK_MS);
  }

  function checkAnswer(){
    if(enteredOps.some(op=>!op)) return false;

    const value=evaluateWithHiddenGroup(
      numbers,
      enteredOps,
      hiddenGroupStart,
      hiddenGroupEnd
    );

    return Number.isFinite(value) && Math.abs(value-target)<1e-9;
  }

  function showCurrentEvaluation(){
    const isCorrect=checkAnswer();

    if(!resultCounted){
      if(isCorrect){
        correct++;
        currentStreak++;
        bestStreak=Math.max(bestStreak,currentStreak);
      }else{
        wrong++;
        currentStreak=0;
      }

      resultCounted=true;
      updateStats();
    }

    const generatedPath=formatGeneratedPath();
    solutionLineEl.textContent=generatedPath
      ? "Rechenweg: " + generatedPath
      : "";

    showFeedback(isCorrect);
  }

  function endRound(reason="timeout"){
    if(reason==="timeout"){
      if(timeExpired) return;

      timeExpired=true;
      roundActive=false;
      cancelAnimationFrame(animationFrame);

      timerFill.style.width="100%";
      popup.classList.remove("show");
      selectedGap=-1;

      // Nach 60 Sekunden ist die Aufgabe vollständig eingefroren.
      // Keine Rechenzeichen können mehr geändert werden.
      showCurrentEvaluation();
      renderEquation();
      return;
    }

    // Next beendet eine noch laufende Aufgabe und wertet sie aus.
    if(roundActive){
      roundActive=false;
      cancelAnimationFrame(animationFrame);
      popup.classList.remove("show");
      selectedGap=-1;

      showCurrentEvaluation();
      renderEquation();
    }
  }

  function animateTimer(token){
    if(!roundActive || token!==roundToken) return;

    const elapsed=performance.now()-roundStart;
    const progress=Math.min(1,elapsed/ROUND_MS);

    timerFill.style.width=`${progress*100}%`;

    if(elapsed>=ROUND_MS){
      endRound("timeout");
      return;
    }

    animationFrame=requestAnimationFrame(()=>animateTimer(token));
  }

  function startRound(){
    roundToken++;
    const token=roundToken;

    cancelAnimationFrame(animationFrame);
    popup.classList.remove("show");
    feedbackEl.classList.remove("show");

    const task=generateTask();

    numbers=task.numbers;
    target=task.target;
    hiddenGroupStart=task.groupStart;
    hiddenGroupEnd=task.groupEnd;
    solutionOps=task.solutionOps || [];

    enteredOps=Array(numbers.length-1).fill(null);
    solutionLineEl.textContent="";
    selectedGap=-1;

    timerFill.style.width="0%";
    timeExpired=false;
    resultCounted=false;
    roundActive=true;
    roundStart=performance.now();

    renderEquation();
    animationFrame=requestAnimationFrame(()=>animateTimer(token));
  }

  nextBtn.addEventListener("pointerdown",(event)=>{
    event.preventDefault();
    flash(nextBtn);

    if(roundActive){
      endRound("next");
    }

    // Egal ob vorzeitig beendet oder Zeit bereits abgelaufen:
    // Eine neue Aufgabe entsteht nur durch diesen Next-Druck.
    setTimeout(startRound,120);
  },{passive:false});

  document.addEventListener("dblclick",(event)=>{
    event.preventDefault();
  },{passive:false});

  let lastTouchEnd=0;

  document.addEventListener("touchend",(event)=>{
    const now=Date.now();

    if(now-lastTouchEnd<=300){
      event.preventDefault();
    }

    lastTouchEnd=now;
  },{passive:false});

  updateStats();
  startRound();
})();
</script>
</body>
</html>
