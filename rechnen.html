<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DLR Rechentrainer</title>

<style>
:root{
  --blue:#bfe3f2;
  --blue2:#8fc7dc;
  --line:#bdbdbd;
  --text:#111;
  --muted:#666;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,select{touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh}

.top-progress{
  position:fixed;top:0;left:0;width:100%;height:6px;background:#e8e8e8;z-index:100
}
.top-progress-bar{height:100%;width:0;background:#444}

.site-nav{
  height:34px;
  margin-top:6px;
  padding:3px 8px 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}
.site-nav a{
  display:flex;align-items:center;justify-content:center;
  border:1px solid #aaa;border-radius:5px;background:#fff;color:#111;
  text-decoration:none;font-size:12px;font-weight:700
}
.site-nav a.active{background:var(--blue);border-color:var(--blue2)}

.settings{
  height:34px;
  display:flex;align-items:center;justify-content:center;
  gap:6px;font-size:12px;font-weight:700
}
.settings select{
  height:28px;min-width:52px;padding:2px 5px;
  border:1px solid #aaa;border-radius:5px;background:#fff;color:#111;font:inherit
}

.app{
  height:calc(100dvh - 74px);
  padding:4px 8px 8px;
  display:grid;
  grid-template-rows:auto auto auto 40px;
  gap:8px;
}

.header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:24px
}
.title{font-size:15px;font-weight:700;white-space:nowrap}
.stats{
  display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;
  font-size:9px;font-variant-numeric:tabular-nums
}
.stats b{font-size:10px}

.task-area{
  min-height:120px;
  display:flex;align-items:center;justify-content:center;
  overflow:visible;
  padding:18px 0 8px
}
.equation{
  display:flex;align-items:center;justify-content:center;
  gap:4px;white-space:nowrap;
  font-size:clamp(26px,7.2vw,48px);
  line-height:1;font-weight:500;font-variant-numeric:tabular-nums
}
.slot{
  width:1.03em;height:1.08em;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;border-bottom:2px solid var(--line);
  background:#ededed;color:#111;font-size:1em;font-weight:500;
  border-radius:0;cursor:pointer
}
.slot.filled{background:var(--blue);border-bottom-color:transparent}
.slot.selected{outline:2px solid var(--blue2)}

.solution{
  min-height:34px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  padding:2px 6px;
  color:#333;font-size:12px;font-weight:700;
  overflow:hidden;
  margin-top:2px
}

.next{
  width:min(360px,100%);
  margin:0 auto;
  height:40px;min-height:40px;padding:0 10px;
  border:1px solid #777;border-radius:5px;background:#efefef;
  color:#111;font-size:14px;font-weight:700
}
.next.pressed{background:var(--blue)}

.popup{
  position:fixed;z-index:200;
  display:none;
  width:52px;
  padding:4px;
  grid-template-columns:1fr;
  gap:3px;
  background:#fff;border:1px solid #999;border-radius:7px;
  box-shadow:0 6px 18px rgba(0,0,0,.18)
}
.popup.show{display:grid}
.popup button{
  width:42px;height:42px;min-height:42px;padding:0;
  border:1px solid #777;border-radius:4px;background:#fff;
  color:#111;font-size:23px;font-weight:500
}
.popup button.pressed{background:var(--blue)}

.feedback{display:none}

@media(min-width:700px){
  .site-nav{width:min(680px,100%);margin-left:auto;margin-right:auto}
  .app{width:min(760px,100%);margin:0 auto}
  .equation{gap:8px}
  .stats{font-size:11px;gap:12px}
  .stats b{font-size:12px}
  .solution{font-size:14px}
  .next{height:42px}
}

@media(max-height:700px){
  .site-nav{height:30px}
  .settings{height:30px}
  .app{height:calc(100dvh - 66px);grid-template-rows:auto auto auto 36px;gap:6px}
  .task-area{min-height:100px;padding:12px 0 4px}
  .next{height:36px;min-height:36px}
  .solution{min-height:28px;font-size:11px}
}
</style>
</head>

<body>
<div class="top-progress"><div id="timerFill" class="top-progress-bar"></div></div>

<nav class="site-nav" aria-label="DLR Training Navigation">
  <a href="index.html">Zahlentrainer</a>
  <a href="rechnen.html" class="active">Rechentrainer</a>
</nav>

<div class="settings">
  <label for="numberCount">Zahlen</label>
  <select id="numberCount">
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5" selected>5</option>
  </select>
</div>

<main class="app">
  <div class="header">
    <div class="title">DLR Rechentrainer</div>
    <div class="stats">
      <span>R <b id="correct">0</b></span>
      <span>F <b id="wrong">0</b></span>
      <span>Quote <b id="rate">0%</b></span>
      <span>Serie <b id="best">0</b></span>
    </div>
  </div>

  <section class="task-area">
    <div id="equation" class="equation"></div>
  </section>

  <div id="solution" class="solution"></div>

  <button id="next" class="next" type="button">Next</button>
</main>

<div id="popup" class="popup">
  <button data-op="+">+</button>
  <button data-op="-">−</button>
  <button data-op="*">×</button>
  <button data-op="/">÷</button>
</div>

<div id="feedback" class="feedback"></div>

<script>
(() => {
  "use strict";

  const ROUND_MS = 60000;

  const timerFill = document.getElementById("timerFill");
  const numberCount = document.getElementById("numberCount");
  const equation = document.getElementById("equation");
  const solution = document.getElementById("solution");
  const next = document.getElementById("next");
  const popup = document.getElementById("popup");
  const feedback = document.getElementById("feedback");

  const correctEl = document.getElementById("correct");
  const wrongEl = document.getElementById("wrong");
  const rateEl = document.getElementById("rate");
  const bestEl = document.getElementById("best");

  let nums = [];
  let target = 0;
  let enteredOps = [];
  let solutionOps = [];
  let groupStart = null;
  let groupEnd = null;

  let selectedGap = -1;
  let roundActive = false;
  let awaitingNext = false;
  let counted = false;
  let startedAt = 0;
  let raf = 0;

  let stats = {correct:0,wrong:0,streak:0,best:0};

  try{
    stats = JSON.parse(localStorage.getItem("dlrMathStatsV2") || JSON.stringify(stats));
  }catch(e){}

  function saveStats(){
    localStorage.setItem("dlrMathStatsV2", JSON.stringify(stats));
    correctEl.textContent = stats.correct;
    wrongEl.textContent = stats.wrong;
    bestEl.textContent = stats.best;
    const total = stats.correct + stats.wrong;
    rateEl.textContent = total ? Math.round(stats.correct / total * 100) + "%" : "0%";
  }

  function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
  }

  function pick(arr){
    return arr[Math.floor(Math.random()*arr.length)];
  }

  function symbol(op){
    if(op==="*") return "×";
    if(op==="/") return "÷";
    if(op==="-") return "−";
    return op;
  }

  function precedence(op){
    return (op==="*" || op==="/") ? 2 : 1;
  }

  function calc(a,b,op){
    if(op==="+") return a+b;
    if(op==="-") return a-b;
    if(op==="*") return a*b;
    if(op==="/") return b===0 ? NaN : a/b;
    return NaN;
  }

  function evalNormal(numbers, ops){
    if(ops.length !== numbers.length-1) return NaN;

    const values=[numbers[0]];
    const operators=[];

    function reduce(){
      const op=operators.pop();
      const b=values.pop();
      const a=values.pop();
      values.push(calc(a,b,op));
    }

    for(let i=0;i<ops.length;i++){
      while(operators.length && precedence(operators[operators.length-1]) >= precedence(ops[i])){
        reduce();
      }
      operators.push(ops[i]);
      values.push(numbers[i+1]);
    }

    while(operators.length) reduce();
    return values[0];
  }

  function evalTask(numbers, ops, gs, ge){
    if(gs===null || ge===null) return evalNormal(numbers,ops);

    const inner = evalNormal(
      numbers.slice(gs,ge+1),
      ops.slice(gs,ge)
    );

    if(!Number.isFinite(inner)) return NaN;

    const reducedNums=[
      ...numbers.slice(0,gs),
      inner,
      ...numbers.slice(ge+1)
    ];

    const reducedOps=[
      ...ops.slice(0,gs),
      ...ops.slice(ge)
    ];

    return evalNormal(reducedNums,reducedOps);
  }

  function createTask(){
    const count = Number(numberCount.value);

    for(let attempt=0; attempt<800; attempt++){
      const n = Array.from({length:count},()=>rand(2,12));

      const ops = Array.from(
        {length:count-1},
        ()=>pick(["+","+","-","-","*","/"])
      );

      const highCount = ops.filter(op=>op==="*" || op==="/").length;
      if(highCount > 2) continue;

      let gs=null, ge=null;

      // Ca. 30 % der Aufgaben verwenden intern eine kleine Klammer,
      // immer nur über zwei benachbarte Zahlen.
      if(count>=3 && Math.random()<0.30){
        gs=rand(0,count-2);
        ge=gs+1;
      }

      // Glatte lokale Divisionen bevorzugen.
      let badDivision=false;
      for(let i=0;i<ops.length;i++){
        if(ops[i]==="/" && !(gs===i && ge===i+1)){
          if(n[i] % n[i+1] !== 0){
            badDivision=true;
            break;
          }
        }
      }
      if(badDivision) continue;

      if(gs!==null){
        const inner=evalNormal(n.slice(gs,ge+1),ops.slice(gs,ge));
        if(!Number.isFinite(inner) || !Number.isInteger(inner) || inner<0 || inner>50) continue;
      }

      const result = evalTask(n,ops,gs,ge);
      if(!Number.isFinite(result) || !Number.isInteger(result)) continue;
      if(result<0 || result>300) continue;

      return {nums:n,target:result,ops,gs,ge};
    }

    return {
      nums:[7,2,3],
      target:27,
      ops:["+","*"],
      gs:0,
      ge:1
    };
  }

  function formatSolution(){
    const parts=[];

    for(let i=0;i<nums.length;i++){
      if(groupStart===i) parts.push("(");
      parts.push(String(nums[i]));
      if(groupEnd===i) parts.push(")");
      if(i<solutionOps.length) parts.push(symbol(solutionOps[i]));
    }

    parts.push("=");
    parts.push(String(target));
    return parts.join(" ");
  }

  function render(){
    equation.innerHTML="";

    nums.forEach((num,i)=>{
      const n=document.createElement("span");
      n.textContent=String(num);
      equation.appendChild(n);

      if(i<nums.length-1){
        const slot=document.createElement("button");
        slot.type="button";
        slot.className="slot";
        slot.textContent=enteredOps[i] ? symbol(enteredOps[i]) : "?";

        if(enteredOps[i]) slot.classList.add("filled");
        if(i===selectedGap && popup.classList.contains("show")) slot.classList.add("selected");

        slot.addEventListener("pointerdown",ev=>{
          ev.preventDefault();
          if(!roundActive) return;
          openPopup(i,slot);
        },{passive:false});

        equation.appendChild(slot);
      }
    });

    const eq=document.createElement("span");
    eq.textContent="=";
    equation.appendChild(eq);

    const res=document.createElement("span");
    res.textContent=String(target);
    equation.appendChild(res);
  }

  function openPopup(index,slot){
    selectedGap=index;
    popup.classList.add("show");

    const r=slot.getBoundingClientRect();
    const width=52;
    const height=4*42 + 3*3 + 8;

    let left=r.left + r.width/2 - width/2;
    left=Math.max(4,Math.min(left,window.innerWidth-width-4));

    let top=r.bottom+4;
    if(top+height > window.innerHeight-4){
      top=Math.max(4,window.innerHeight-height-4);
    }

    popup.style.left=left+"px";
    popup.style.top=top+"px";
    render();
  }

  function closePopup(){
    popup.classList.remove("show");
    selectedGap=-1;
    render();
  }

  document.querySelectorAll("[data-op]").forEach(btn=>{
    btn.addEventListener("pointerdown",ev=>{
      ev.preventDefault();
      ev.stopPropagation();

      if(!roundActive || selectedGap<0) return;

      btn.classList.add("pressed");
      setTimeout(()=>btn.classList.remove("pressed"),80);

      enteredOps[selectedGap]=btn.dataset.op;
      closePopup();
    },{passive:false});
  });

  document.addEventListener("pointerdown",ev=>{
    if(
      popup.classList.contains("show") &&
      !popup.contains(ev.target) &&
      !ev.target.classList.contains("slot")
    ){
      closePopup();
    }
  },{passive:true});

  function checkAnswer(){
    if(enteredOps.some(op=>!op)) return false;
    const value=evalTask(nums,enteredOps,groupStart,groupEnd);
    return Number.isFinite(value) && Math.abs(value-target)<1e-9;
  }

  function finishTask(fromTimeout){
    if(awaitingNext) return;

    roundActive=false;
    awaitingNext=true;
    cancelAnimationFrame(raf);
    closePopup();

    if(fromTimeout) timerFill.style.width="100%";

    const ok=checkAnswer();

    if(!counted){
      if(ok){
        stats.correct++;
        stats.streak++;
        stats.best=Math.max(stats.best,stats.streak);
      }else{
        stats.wrong++;
        stats.streak=0;
      }
      counted=true;
      saveStats();
    }

    feedback.className="feedback";
    feedback.textContent="";

    solution.textContent=(ok ? "Richtig · " : "Falsch · ") + formatSolution();
    next.textContent="Nächste Aufgabe";

    render();
  }

  function animate(){
    if(!roundActive) return;

    const elapsed=performance.now()-startedAt;
    const pct=Math.min(elapsed/ROUND_MS,1);
    timerFill.style.width=(pct*100)+"%";

    if(pct>=1){
      finishTask(true);
      return;
    }

    raf=requestAnimationFrame(animate);
  }

  function startTask(){
    cancelAnimationFrame(raf);
    popup.classList.remove("show");
    feedback.className="feedback";

    const t=createTask();
    nums=t.nums;
    target=t.target;
    solutionOps=t.ops;
    groupStart=t.gs;
    groupEnd=t.ge;

    enteredOps=Array(nums.length-1).fill(null);
    selectedGap=-1;
    counted=false;
    awaitingNext=false;
    roundActive=true;

    solution.textContent="";
    next.textContent="Next";
    timerFill.style.width="0%";

    render();

    startedAt=performance.now();
    raf=requestAnimationFrame(animate);
  }

  next.addEventListener("pointerdown",ev=>{
    ev.preventDefault();
    next.classList.add("pressed");
    setTimeout(()=>next.classList.remove("pressed"),80);

    if(awaitingNext){
      startTask();
    }else if(roundActive){
      finishTask(false);
    }
  },{passive:false});

  document.addEventListener("dblclick",ev=>ev.preventDefault(),{passive:false});

  saveStats();
  startTask();

  (async()=>{
    try{
      if("serviceWorker" in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      if("caches" in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    }catch(e){}
  })();
})();
</script>
</body>
</html>
